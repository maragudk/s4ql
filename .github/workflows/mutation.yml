name: Mutation

# The weekly round of mutation testing, in shards that run at the same time: see
# internal/sql/mutation/README.md. By default a round mutates every declaration of the packages that
# the runner knows that changed since the commit of the last completed round, which
# internal/sql/mutation/round.txt holds; started by hand, it can mutate a package, a file, or
# everything. The job plan selects the mutants once, and each shard runs its share of them, which
# the runner deals out by their keys, so that every shard agrees on it without talking to the
# others. Each shard plans its packages on its own runner: it builds the tests of the code as it is
# and times each stage, from which come the time limits of its mutants. The job report merges the
# results, writes the report into the summary of the run, and opens an issue with the label
# mutation when the round leaves work, or comments on the one that is open: an unexplained survivor,
# a stale entry of the list of equivalent mutants, a mutant without a result, or a shard or a merge
# that failed. The issue stays open until a builder has worked through it and recorded the round.
#
# Nothing else waits on this workflow, and no other workflow or branch protection needs it.
on:
  # Saturdays at 06:43 UTC, after the nightly of 02:17, whose longest jobs end by about 05:20.
  schedule:
    - cron: "43 6 * * 6"
  workflow_dispatch:
    inputs:
      since:
        description: "round mutates the declarations that changed since the commit of internal/sql/mutation/round.txt; a commit, those that changed since it; all, every declaration."
        default: round
      pkgs:
        description: "The packages to mutate, separated by commas, such as internal/engine or ., or all for every package that the runner knows."
        default: all
      run:
        description: "A regular expression: only the mutants whose key or file:line matches it, such as ^internal/engine/several\\.go for a file. Empty selects all."
        default: ""
      shards:
        description: "The most shards. A selection gets one shard for each 10 mutants, up to this."
        default: "20"
      issue:
        description: "Open or comment on the issue of mutation testing when the run leaves work."
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

# The inputs reach the shell through the environment only. A scheduled run has no inputs, and gets
# the defaults.
env:
  SINCE: ${{ inputs.since || 'round' }}
  PKGS: ${{ inputs.pkgs || 'all' }}
  RUN: ${{ inputs.run }}
  MOST_SHARDS: ${{ inputs.shards || '20' }}

jobs:
  # Selects the mutants and decides the shards. The whole history is fetched, for the diff since the
  # last round.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base: ${{ steps.select.outputs.base }}
      mutants: ${{ steps.select.outputs.mutants }}
      shards: ${{ steps.select.outputs.shards }}
      matrix: ${{ steps.select.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/go
        with:
          cache: mutation-plan

      - name: Select the mutants
        id: select
        run: |
          case "$SINCE" in
          all) base= ;;
          round) base=$(sed -e '/^#/d' -e '/^[[:space:]]*$/d' internal/sql/mutation/round.txt | head -n 1) ;;
          *) base=$SINCE ;;
          esac
          if [ -n "$base" ]; then
            base=$(git rev-parse --verify "$base^{commit}")
          fi
          go run ./internal/sql/mutation -list -pkgs "$PKGS" -run "$RUN" -since "$base" >"$RUNNER_TEMP/mutants"
          mutants=$(wc -l <"$RUNNER_TEMP/mutants" | tr -d ' ')
          shards=$(( (mutants + 9) / 10 ))
          if [ "$shards" -gt "$MOST_SHARDS" ]; then
            shards=$MOST_SHARDS
          fi
          if [ "$shards" -lt 1 ]; then
            shards=1
          fi
          {
            echo "base=$base"
            echo "mutants=$mutants"
            echo "shards=$shards"
            echo "matrix=[$(seq -s , 1 "$shards")]"
          } | tee -a "$GITHUB_OUTPUT"
          cut -f 1 "$RUNNER_TEMP/mutants" | cut -d : -f 1 | sort | uniq -c

  # Runs the share of one shard, with as many mutants at once as the runner has cores, and uploads
  # its results, also those of a shard that failed or ran out of time, whose other mutants then have
  # no result. The run's own limit comes before the job's, so that the upload still runs. The cache
  # is that of CI's job sql, which builds the same packages without the race detector, so SQLite is
  # not compiled again; the builds of the mutants are never saved.
  shard:
    needs: plan
    if: ${{ needs.plan.outputs.mutants != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/go
        with:
          cache: sql

      - name: Run the mutants of the shard
        timeout-minutes: 300
        env:
          BASE: ${{ needs.plan.outputs.base }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: go run ./internal/sql/mutation -out "$RUNNER_TEMP/mutation" -pkgs "$PKGS" -run "$RUN" -since "$BASE" -shard "$SHARD" -j "$(nproc)"

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/mutation/fingerprint
            ${{ runner.temp }}/mutation/results.jsonl
            ${{ runner.temp }}/mutation/report.txt
          if-no-files-found: warn
          retention-days: 30

  # Merges the results of the shards, writes the report into the summary of the run, and opens or
  # comments on the issue of the round, on main only, as the nightly does for its failures.
  report:
    needs: [plan, shard]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/go
        with:
          cache: mutation-plan

      - uses: actions/download-artifact@v8
        if: ${{ needs.plan.outputs.mutants != '0' }}
        with:
          pattern: mutation-shard-*
          path: shards

      - name: Merge the results of the shards
        id: merge
        if: ${{ needs.plan.outputs.mutants != '0' }}
        env:
          BASE: ${{ needs.plan.outputs.base }}
        run: go run ./internal/sql/mutation -out merged -merge 'shards/*' -pkgs "$PKGS" -run "$RUN" -since "$BASE"

      - uses: actions/upload-artifact@v7
        if: ${{ always() && steps.merge.outcome != 'skipped' }}
        with:
          name: mutation-report
          path: merged/
          if-no-files-found: warn
          retention-days: 90

      - name: Write the report of the round
        id: report
        if: ${{ always() }}
        env:
          SHA: ${{ github.sha }}
          BASE: ${{ needs.plan.outputs.base }}
          MUTANTS: ${{ needs.plan.outputs.mutants }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          SHARD_RESULT: ${{ needs.shard.result }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sh .github/scripts/mutation-report.sh "$RUNNER_TEMP/report.md" >>"$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/report.md" >>"$GITHUB_STEP_SUMMARY"

      # A scheduled run has no inputs, so its inputs.issue is null, which equals false in a comparison.
      # An issue's body holds at most 65,536 characters, so a longer report is left in the summary of
      # the run and in the artifact mutation-report.
      - name: Open or comment on the issue of mutation testing
        if: ${{ always() && steps.report.outputs.issue == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.issue) }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/report.md"
          if [ "$(wc -c <"$body")" -gt 60000 ]; then
            body="$RUNNER_TEMP/short.md"
            echo "The report of the mutation round is too long for an issue. It is in the summary of $RUN_URL, and in its artifact mutation-report." >"$body"
          fi
          gh label create mutation --color 5319E7 --description "A round of mutation testing left work" || true
          existing="$(gh issue list --label mutation --state open --limit 1 --json number --jq '.[].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --title "The round of mutation testing of $(date -u +%Y-%m-%d) left work" --label mutation --body-file "$body"
          fi
