name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Each push to main has a group of its own. The job changes compares a push with the commit before it
# only, so a run that a later push cancelled while it waited would leave the commits of its push
# untested. A pull request is compared with its base, so a new run of it may cancel the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

# The packages whose tests have jobs of their own, because they take the longest: test-core and
# test-engine under the race detector, and asan-core and asan-engine under the address sanitizer,
# which split TestSimulation_plantedBugs into shards. The jobs test and asan run every other
# package, and leave out these, so that a package is in exactly one job of each kind.
env:
  CORE: maragu.dev/s4ql/internal/core
  ENGINE: maragu.dev/s4ql/internal/engine

# Each job sets timeout-minutes to about three times the longest it took in 194 runs of 2026-11-18
# to 2026-11-20, and at least 5. A job whose go test has a -timeout of its own gets more, so that
# the timeout of go test, which prints the stacks of the goroutines, comes first. Each job that
# builds Go code sets up Go with the action go, which restores a build cache of its own, and saves
# it with the action go-save on main: see .github/actions/go. The job browser is the exception to
# both for now, with setup-go's cache and no timeout-minutes, while its hang is looked into apart.
jobs:
  # Decides what the change touches, so that the other jobs run only where it needs them: with code,
  # every job runs; with documents only, none; with the site and documents only, the job site alone.
  # The rule is an allowlist of paths that are not code, in .github/scripts/changes.sh, and when the
  # decision cannot be made, such as for a forced push, everything runs. The other jobs skip only on
  # an output of exactly 'false', and run with !cancelled() even when this job fails, so that a
  # failure here runs everything rather than nothing. The whole history is fetched, so that the base
  # of a pull request and the commit before a push are in the checkout.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
      site: ${{ steps.decide.outputs.site }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # What make test-changes runs. The job has no Go set up, and make would run go env when it reads
      # the Makefile, which may download the toolchain that go.mod names.
      - name: Test the rule
        run: sh .github/scripts/changes_test.sh

      # A pull request is compared with its base, and a push with the commit before it, which takes
      # in all the commits of the push.
      - name: Decide what the change touches
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          HEAD: ${{ github.sha }}
        run: |
          sh .github/scripts/changes.sh event >"$RUNNER_TEMP/changes"
          cat "$RUNNER_TEMP/changes"
          cat "$RUNNER_TEMP/changes" >>"$GITHUB_OUTPUT"

  # golangci-lint over the library, as the reusable lint workflow of maragudk/workflows does, which
  # this job was before, inline so that it has a timeout and a build cache. As there, it does not run
  # for Dependabot.
  lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.triggering_actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/go
        with:
          cache: lint

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - uses: ./.github/actions/go-save
        if: ${{ !cancelled() }}

  # go test ./... under the race detector, without -short, so the tests against a real bucket run
  # too, and fail without their credentials: the bucket is named in .env.test, and the two secrets
  # below are in the environment of the test run only. Each test writes under a prefix of its own,
  # and each test process first deletes the old prefixes that killed runs left: see
  # internal/store/s3test. A pull request from Dependabot gets Dependabot's secrets, which hold the
  # same two. One from a fork gets none, so the tests against the bucket fail there; the repository
  # takes no pull requests from forks. The steps are those of the reusable test workflow of
  # maragudk/workflows, which this job was before, inline so that it has a timeout and a build cache.
  # The packages of CORE and ENGINE are left out here, and test-core and test-engine run them; go
  # list fails if one of the two names is not a package.
  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/go
        with:
          cache: test-race

      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          go list "$CORE" "$ENGINE" >/dev/null
          pkgs=$(go list ./... | grep -vxF -e "$CORE" -e "$ENGINE")
          go test -race -shuffle on -timeout 20m $pkgs

      - uses: ./.github/actions/go-save
        if: ${{ !cancelled() }}

  # The tests of the storage core under the race detector, out of the job test. internal/core took
  # 466 s at the most there, beside the other packages.
  test-core:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/go
        with:
          cache: test-core-race

      - name: Test the storage core under the race detector
        run: go test -race -shuffle on -timeout 20m "$CORE"

      - uses: ./.github/actions/go-save
        if: ${{ !cancelled() }}

  # The tests of the engine under the race detector, out of the job test. internal/engine took 395 s
  # there on 2026-11-20, beside the other packages.
  test-engine:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/go
        with:
          cache: test-engine-race

      - name: Test the engine under the race detector
        run: go test -race -shuffle on -timeout 20m "$ENGINE"

      - uses: ./.github/actions/go-save
        if: ${{ !cancelled() }}

  # Library code must follow the rules of the simulation, which golangci-lint does not know. The lint
  # is a separate module, which the reusable workflows above do not see. The free-running mode of the
  # simulation exists for the race detector, so this job runs it under the race detector, whatever
  # the job test does.
  simulation:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/go
        with:
          cache: simulation
          go-version-file: internal/simlint/go.mod

      - name: Check that the lint's go.mod and go.sum are tidy
        working-directory: internal/simlint
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Test the lint
        working-directory: internal/simlint
        run: go test -shuffle on ./...

      - name: Lint for the simulation
        run: (cd internal/simlint && go build -o "$RUNNER_TEMP/simlint" ./cmd/simlint) && "$RUNNER_TEMP/simlint" ./...

      - name: Lint the lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: internal/simlint

      - name: Run the free-running mode under the race detector
        run: go test -race -shuffle on -run '^TestFree' ./internal/sim/ ./internal/core/

      # make sim-speed and make sim-hang build tests with tags of their own, which no other job
      # compiles. They are tools for a person, so they are vetted here and not run.
      - name: Vet the tests that only a person runs
        run: go vet -tags s4ql_speed ./internal/sim/ && go vet -tags s4ql_hang ./internal/sim/

      - uses: ./.github/actions/go-save
        if: ${{ !cancelled() }}

  # Most tests of the SQL front end compare with SQLite on a tenth of the corpus and of the generated
  # texts under the race detector, which the job test uses, and under the address sanitizer, and
  # leave out the checks that need all of them. This job runs them without either.
  sql:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/go
        with:
          cache: sql

      - name: Test the SQL front end on the whole corpus
        run: make test-sql

      - uses: ./.github/actions/go-save
        if: ${{ !cancelled() }}

  # The schema of the commit object: Buf's lint, and a check that the committed generated code is what
  # the schema generates.
  proto:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/go
        with:
          cache: proto

      - name: Lint the schema
        run: make lint-proto

      - name: Check that the generated code is up to date
        run: make generate && git status --porcelain && test -z "$(git status --porcelain)"

      - uses: ./.github/actions/go-save
        if: ${{ !cancelled() }}

  # The cross-checks against github.com/mattn/go-sqlite3 are a separate module, which the reusable
  # workflows above do not see.
  crosscheck:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: internal/sqlite/crosscheck

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Paths in uses steps are relative to the repository root, not to the working directory above.
      - uses: ./.github/actions/go
        with:
          cache: crosscheck-race
          go-version-file: internal/sqlite/crosscheck/go.mod

      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Test
        run: go test -race -shuffle on ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: internal/sqlite/crosscheck

      - uses: ./.github/actions/go-save
        if: ${{ !cancelled() }}

  # The SQLite binding is memory-unsafe code, so the tests of both modules also go under the C address
  # sanitizer. It finds faults in C code only, so make asan-test runs the packages whose test binaries
  # link C, and the job test alone runs the others. The jobs asan, asan-core, asan-engine, asan-fuzz,
  # and fuzz together run what make test-asan runs, and fuzz also checks the heap of a large
  # transaction. This job runs every package that links C but those of CORE and ENGINE,
  # and make asan-test fails if a name there is not such a package.
  asan:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/go
        with:
          cache: asan

      - name: Test under the address sanitizer
        run: make asan-test ASANSKIPPKGS="$CORE $ENGINE" ASANTIMEOUT=20m

      - uses: ./.github/actions/go-save
        if: ${{ !cancelled() }}

  # The tests of the storage core under the address sanitizer, in shards that run at the same time:
  # each runs its share of the planted bugs of TestSimulation_plantedBugs, which internal/testshard
  # gives out by their index, and the first also every other test of the package. The number of
  # shards is the size of the matrix, so a shard cannot go missing. internal/core took 591 s at the
  # most in the job asan, beside the other packages. The first shard runs go test twice, each with
  # the timeout of 15 minutes, so the job's timeout is above both.
  asan-core:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/go
        with:
          cache: asan-core

      - name: Test the storage core under the address sanitizer
        run: make asan-test ASANPKGS="$CORE" ASANSHARD=${{ matrix.shard }}/${{ strategy.job-total }} ASANTIMEOUT=15m

      # The shards build the same, so the first saves for all.
      - uses: ./.github/actions/go-save
        if: ${{ !cancelled() }}
        with:
          save: ${{ matrix.shard == 1 }}

  # The tests of the engine under the address sanitizer, in shards, as asan-core does for the core.
  # internal/engine took 468 s at the most in the job asan.
  asan-engine:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/go
        with:
          cache: asan-engine

      - name: Test the engine under the address sanitizer
        run: make asan-test ASANPKGS="$ENGINE" ASANSHARD=${{ matrix.shard }}/${{ strategy.job-total }} ASANTIMEOUT=15m

      - uses: ./.github/actions/go-save
        if: ${{ !cancelled() }}
        with:
          save: ${{ matrix.shard == 1 }}

  # A short fuzz run of the fuzz tests whose test binaries link C, under the address sanitizer, in
  # shards that run at the same time. make fuzz gives the fuzz tests to the shards one by one, and
  # make fuzz-shards checks that every directory with a fuzz test is in FUZZDIRS and that the shards
  # of the matrix hold every fuzz test of the group exactly once.
  asan-fuzz:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/go
        with:
          cache: asan-fuzz-${{ matrix.shard }}

      - name: Check that the shards hold every fuzz test once
        run: make fuzz-shards FUZZGROUP=c FUZZSHARDS=${{ strategy.job-total }}

      - name: Fuzz under the address sanitizer
        run: make fuzz FUZZGROUP=c FUZZFLAGS=-asan FUZZSHARD=${{ matrix.shard }}/${{ strategy.job-total }} FUZZTIME=30s

      - name: Show the inputs that made a fuzz test fail
        if: failure()
        run: sh .github/scripts/fuzz-failures.sh

      - uses: ./.github/actions/go-save
        if: ${{ !cancelled() }}

  # A short fuzz run of the fuzz tests whose test binaries link no C, without the sanitizer, which
  # has nothing to check in them.
  fuzz:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/go
        with:
          cache: fuzz

      # The check that a large transaction is never held in memory runs only without the race
      # detector and the sanitizer, which change the heap, and the job test uses the race detector.
      # -count=1, since a result from the build cache would not be a run.
      - name: Check the heap of a large transaction
        run: go test -count=1 -run '^TestTx_Commit_large$' ./internal/core/

      - name: Fuzz
        run: make fuzz FUZZGROUP=go FUZZTIME=30s

      - name: Show the inputs that made a fuzz test fail
        if: failure()
        run: sh .github/scripts/fuzz-failures.sh

      - uses: ./.github/actions/go-save
        if: ${{ !cancelled() }}
  # The storage core also runs in a web browser, on the official SQLite WebAssembly build, through a
  # second implementation of the binding behind the tag s4ql_browser. A native build does not see its
  # files, so this job builds, vets, and lints them, and compiles the tests of every package that runs
  # in a browser, which fails on any drift from the API of the cgo binding. The job browser-test runs
  # the tests in headless Chrome, and the job site checks the simulator's page.
  browser:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build, vet, and compile the tests for the browser
        run: make check-browser

      - name: Lint the browser's build
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: js
          GOARCH: wasm
        with:
          version: latest
          args: --build-tags s4ql_browser ./internal/sqlite ./internal/sqlite/faultvfs ./internal/core ./internal/sim ./internal/store/simstore ./internal/simulator ./internal/simulator/engine

      # The simulator builds natively too, with the tag, and is linted for the simulation there.
      - name: Test the simulator natively
        run: go test -race -tags s4ql_browser -shuffle on ./internal/simulator/...

      - name: Lint the simulator's native build
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --build-tags s4ql_browser ./internal/simulator/...

      - name: Lint the simulator for the simulation
        run: (cd internal/simlint && go build -o "$RUNNER_TEMP/simlint" ./cmd/simlint) && GOFLAGS=-tags=s4ql_browser "$RUNNER_TEMP/simlint" ./internal/simulator/...

      # The files built only for the browser, such as the binding on the SQLite WebAssembly build,
      # are library code too.
      - name: Lint the browser's build for the simulation
        env:
          GOOS: js
          GOARCH: wasm
          GOFLAGS: -tags=s4ql_browser
        run: '"$RUNNER_TEMP/simlint" ./internal/sqlite ./internal/sqlite/faultvfs ./internal/core ./internal/sim ./internal/store/simstore ./internal/simulator ./internal/simulator/engine'

  # The tests of the packages that run in a browser, in headless Chrome, which the runner image has,
  # in shards that run at the same time: make test-browser puts each test in exactly one shard. The
  # slowest shard's tests take about 3 minutes on a slow runner, and a Chromium that does not start
  # can cost the runner of internal/sqlite/browser up to 3.5 more, so a test binary has 7 minutes,
  # and the runner stops it 30 seconds after. Under -v, the runner then names the tests that ran.
  browser-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # Chrome's sandbox needs user namespaces, which the runner may not allow, and the page runs only
      # the project's own code from 127.0.0.1.
      - name: Test in headless Chrome
        env:
          S4QL_CHROMIUM_FLAGS: --no-sandbox
          S4QL_CHROMIUM_STEPS: 1
        run: make test-browser BROWSERSHARD=${{ matrix.shard }}/${{ strategy.job-total }} BROWSERTIMEOUT=7m BROWSERFLAGS=-v

  # Builds the engine into the site, as the Pages workflow does, and checks the simulator's page in
  # headless Chrome: see internal/simulator/sitecheck. It reads site/ and the Go code, so it runs for
  # a change to either, also when no other job but changes runs. make site-check runs the check
  # twice, each with a timeout of 3 minutes, after which the check prints what it saw of the hang,
  # so the job's timeout is above two of them and the builds.
  site:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.site != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/go
        with:
          cache: site-wasm

      # Chrome's sandbox needs user namespaces, which the runner may not allow, and the page runs only
      # the project's own code from 127.0.0.1.
      - name: Check the simulator's page in headless Chrome
        env:
          S4QL_CHROMIUM_FLAGS: --no-sandbox
        run: make site-check

      - uses: ./.github/actions/go-save
        if: ${{ !cancelled() }}
