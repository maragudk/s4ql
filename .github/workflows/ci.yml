name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  lint:
    uses: maragudk/workflows/.github/workflows/lint.yml@main

  test:
    uses: maragudk/workflows/.github/workflows/test.yml@main

  # Library code must follow the rules of the simulation, which golangci-lint does not know. The lint
  # is a separate module, which the reusable workflows above do not see. The free-running mode of the
  # simulation exists for the race detector, so this job runs it under the race detector, whatever
  # the reusable test workflow does.
  simulation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: internal/simlint/go.mod
          cache-dependency-path: internal/simlint/go.sum
          check-latest: true

      - name: Check that the lint's go.mod and go.sum are tidy
        working-directory: internal/simlint
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Test the lint
        working-directory: internal/simlint
        run: go test -shuffle on ./...

      - name: Lint for the simulation
        run: (cd internal/simlint && go build -o "$RUNNER_TEMP/simlint" ./cmd/simlint) && "$RUNNER_TEMP/simlint" ./...

      - name: Lint the lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: internal/simlint

      - name: Run the free-running mode under the race detector
        run: go test -race -shuffle on -run 'TestFreeRunning|TestFree$' ./internal/sim/

  # The schema of the commit object: Buf's lint, and a check that the committed generated code is what
  # the schema generates.
  proto:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Lint the schema
        run: make lint-proto

      - name: Check that the generated code is up to date
        run: make generate && git status --porcelain && test -z "$(git status --porcelain)"

  # The cross-checks against github.com/mattn/go-sqlite3 are a separate module, which the reusable
  # workflows above do not see.
  crosscheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/sqlite/crosscheck

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Paths in uses steps are relative to the repository root, not to the working directory above.
      - uses: actions/setup-go@v7
        with:
          go-version-file: internal/sqlite/crosscheck/go.mod
          cache-dependency-path: internal/sqlite/crosscheck/go.sum
          check-latest: true

      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Test
        run: go test -race -shuffle on ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: internal/sqlite/crosscheck

  # The SQLite binding is memory-unsafe code, so its tests and a short fuzz run also go under the C
  # address sanitizer.
  asan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test and fuzz under the address sanitizer
        run: make test-asan FUZZTIME=30s

      - name: Show the inputs that made a fuzz test fail
        if: failure()
        run: find . -path '*/testdata/fuzz/*' -type f -print -exec cat {} \;
