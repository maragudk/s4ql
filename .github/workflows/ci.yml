name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Each push to main has a group of its own. The job changes compares a push with the commit before it
# only, so a run that a later push cancelled while it waited would leave the commits of its push
# untested. A pull request is compared with its base, so a new run of it may cancel the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  # Decides what the change touches, so that the other jobs run only where it needs them: with code,
  # every job runs; with documents only, none; with the site and documents only, the job site alone.
  # The rule is an allowlist of paths that are not code, in .github/scripts/changes.sh, and when the
  # decision cannot be made, such as for a forced push, everything runs. The other jobs skip only on
  # an output of exactly 'false', and run with !cancelled() even when this job fails, so that a
  # failure here runs everything rather than nothing. The whole history is fetched, so that the base
  # of a pull request and the commit before a push are in the checkout.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
      site: ${{ steps.decide.outputs.site }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # What make test-changes runs. The job has no Go set up, and make would run go env when it reads
      # the Makefile, which may download the toolchain that go.mod names.
      - name: Test the rule
        run: sh .github/scripts/changes_test.sh

      # A pull request is compared with its base, and a push with the commit before it, which takes
      # in all the commits of the push.
      - name: Decide what the change touches
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          HEAD: ${{ github.sha }}
        run: |
          sh .github/scripts/changes.sh event >"$RUNNER_TEMP/changes"
          cat "$RUNNER_TEMP/changes"
          cat "$RUNNER_TEMP/changes" >>"$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    uses: maragudk/workflows/.github/workflows/lint.yml@main

  # go test ./..., without -short, so the tests against a real bucket run too, and fail without their
  # credentials: the bucket is named in .env.test, and the two secrets below are exported into the
  # test run. Each test writes under a prefix of its own, and each test process first deletes the old
  # prefixes that killed runs left: see internal/store/s3test. A pull request from Dependabot gets
  # Dependabot's secrets, which hold the same two. One from a fork gets none, so the tests against the
  # bucket fail there; the repository takes no pull requests from forks.
  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    uses: maragudk/workflows/.github/workflows/test.yml@main
    secrets: inherit
    with:
      secret-env: AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY

  # Library code must follow the rules of the simulation, which golangci-lint does not know. The lint
  # is a separate module, which the reusable workflows above do not see. The free-running mode of the
  # simulation exists for the race detector, so this job runs it under the race detector, whatever
  # the reusable test workflow does.
  simulation:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: internal/simlint/go.mod
          # The lint runs over the library, and the free-running mode is the library's test.
          cache-dependency-path: |
            go.sum
            internal/simlint/go.sum
          check-latest: true

      - name: Check that the lint's go.mod and go.sum are tidy
        working-directory: internal/simlint
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Test the lint
        working-directory: internal/simlint
        run: go test -shuffle on ./...

      - name: Lint for the simulation
        run: (cd internal/simlint && go build -o "$RUNNER_TEMP/simlint" ./cmd/simlint) && "$RUNNER_TEMP/simlint" ./...

      - name: Lint the lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: internal/simlint

      - name: Run the free-running mode under the race detector
        run: go test -race -shuffle on -run '^TestFree' ./internal/sim/ ./internal/core/

  # Most tests of the SQL front end compare with SQLite on a tenth of the corpus and of the generated
  # texts under the race detector, which the reusable test workflow uses, and under the address
  # sanitizer, and leave out the checks that need all of them. This job runs them without either.
  sql:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test the SQL front end on the whole corpus
        run: make test-sql

  # The schema of the commit object: Buf's lint, and a check that the committed generated code is what
  # the schema generates.
  proto:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Lint the schema
        run: make lint-proto

      - name: Check that the generated code is up to date
        run: make generate && git status --porcelain && test -z "$(git status --porcelain)"

  # The cross-checks against github.com/mattn/go-sqlite3 are a separate module, which the reusable
  # workflows above do not see.
  crosscheck:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/sqlite/crosscheck

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Paths in uses steps are relative to the repository root, not to the working directory above.
      - uses: actions/setup-go@v7
        with:
          go-version-file: internal/sqlite/crosscheck/go.mod
          cache-dependency-path: internal/sqlite/crosscheck/go.sum
          check-latest: true

      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Test
        run: go test -race -shuffle on ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: internal/sqlite/crosscheck

  # The SQLite binding is memory-unsafe code, so the tests of both modules also go under the C address
  # sanitizer. It finds faults in C code only, so make asan-test runs the packages whose test binaries
  # link C, and the job test alone runs the others. The jobs asan, asan-fuzz, and fuzz together run
  # what make test-asan runs, and fuzz also checks the heap of a large transaction.
  asan:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test under the address sanitizer
        run: make asan-test

  # A short fuzz run of the fuzz tests whose test binaries link C, under the address sanitizer, in
  # shards that run at the same time. make fuzz puts each fuzz test in exactly one shard.
  asan-fuzz:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Fuzz under the address sanitizer
        run: make fuzz FUZZGROUP=c FUZZFLAGS=-asan FUZZSHARD=${{ matrix.shard }}/${{ strategy.job-total }} FUZZTIME=30s

      - name: Show the inputs that made a fuzz test fail
        if: failure()
        run: find . -path '*/testdata/fuzz/*' -type f -print -exec cat {} \;

  # A short fuzz run of the fuzz tests whose test binaries link no C, without the sanitizer, which
  # has nothing to check in them.
  fuzz:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # The check that a large transaction is never held in memory runs only without the race
      # detector and the sanitizer, which change the heap, and the reusable test workflow uses the
      # race detector.
      - name: Check the heap of a large transaction
        run: go test -run '^TestTx_Commit_large$' ./internal/core/

      - name: Fuzz
        run: make fuzz FUZZGROUP=go FUZZTIME=30s

      - name: Show the inputs that made a fuzz test fail
        if: failure()
        run: find . -path '*/testdata/fuzz/*' -type f -print -exec cat {} \;

  # The storage core also runs in a web browser, on the official SQLite WebAssembly build, through a
  # second implementation of the binding behind the tag s4ql_browser. A native build does not see its
  # files, so this job builds, vets, and lints them, and compiles the tests of every package that runs
  # in a browser, which fails on any drift from the API of the cgo binding. It then runs the tests in
  # headless Chrome, which the runner image has. The job site checks the simulator's page.
  browser:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build, vet, and compile the tests for the browser
        run: make check-browser

      - name: Lint the browser's build
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: js
          GOARCH: wasm
        with:
          version: latest
          args: --build-tags s4ql_browser ./internal/sqlite ./internal/sqlite/faultvfs ./internal/core ./internal/sim ./internal/store/simstore ./internal/simulator ./internal/simulator/engine

      # The simulator builds natively too, with the tag, and is linted for the simulation there.
      - name: Test the simulator natively
        run: go test -race -tags s4ql_browser -shuffle on ./internal/simulator/...

      - name: Lint the simulator's native build
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --build-tags s4ql_browser ./internal/simulator/...

      - name: Lint the simulator for the simulation
        run: (cd internal/simlint && go build -o "$RUNNER_TEMP/simlint" ./cmd/simlint) && GOFLAGS=-tags=s4ql_browser "$RUNNER_TEMP/simlint" ./internal/simulator/...

      # The files built only for the browser, such as the binding on the SQLite WebAssembly build,
      # are library code too.
      - name: Lint the browser's build for the simulation
        env:
          GOOS: js
          GOARCH: wasm
          GOFLAGS: -tags=s4ql_browser
        run: '"$RUNNER_TEMP/simlint" ./internal/sqlite ./internal/sqlite/faultvfs ./internal/core ./internal/sim ./internal/store/simstore ./internal/simulator ./internal/simulator/engine'

      # Chrome's sandbox needs user namespaces, which the runner may not allow, and the page runs only
      # the project's own code from 127.0.0.1.
      - name: Test in headless Chrome
        env:
          S4QL_CHROMIUM_FLAGS: --no-sandbox
        run: make test-browser

  # Builds the engine into the site, as the Pages workflow does, and checks the simulator's page in
  # headless Chrome: see internal/simulator/sitecheck. It reads site/ and the Go code, so it runs for
  # a change to either, also when no other job but changes runs.
  site:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.site != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # Chrome's sandbox needs user namespaces, which the runner may not allow, and the page runs only
      # the project's own code from 127.0.0.1.
      - name: Check the simulator's page in headless Chrome
        env:
          S4QL_CHROMIUM_FLAGS: --no-sandbox
        run: make site-check
