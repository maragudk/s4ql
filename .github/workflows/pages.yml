name: Pages

# Deploys the project site in site/ to GitHub Pages at www.s4ql.com. The site is static, but for the
# simulator's engine: make site builds the storage core into site/simulator/engine/ from this commit,
# with build.json, which names the commit for the page. The workflow therefore also runs when the code
# that the engine is built from changes, so that the simulator always runs the current code.

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build the simulator's engine into the site
        env:
          SITECOMMIT: ${{ github.sha }}
        run: make site SITECOMMIT="$SITECOMMIT"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
