name: Pages

# Deploys the project site in site/ to GitHub Pages at www.s4ql.com. The site is static, but for the
# simulator's engine: make site builds the storage core into site/simulator/engine/ from this commit,
# with build.json, which names the commit for the page. The workflow therefore also runs when the code
# that the engine is built from changes, so that the simulator always runs the current code.
#
# make site also writes this commit as the version into the simulator's page on the checkout, so
# that the page loads every file of the simulator with the query ?v=<commit>. The CDN in front of
# GitHub Pages lets a browser keep scripts for hours and HTML for minutes, so without the version
# the HTML of one deploy could run the scripts of another.
#
# The job build builds the site and uploads it as the Pages artifact, and the job deploy deploys
# that artifact. They are two jobs because deploy-pages looks the artifact up by name in a listing
# of the run's artifacts, and right after the upload that listing can still be empty, as in
# actions/deploy-pages#451. If deploy fails, re-run the failed jobs only: that re-runs deploy on the
# artifact that build uploaded. A re-run of build as well uploads a second artifact of the same
# name, which deploy-pages refuses.

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build the simulator's engine into the site, and write the version into its page
        env:
          SITECOMMIT: ${{ github.sha }}
        run: make site SITECOMMIT="$SITECOMMIT" SITEVERSION="$SITECOMMIT"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
