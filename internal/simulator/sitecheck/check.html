<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check of the simulator page</title>
</head>
<body>
<p>This page loads the simulator page in a frame, drives it, and posts what it saw to sitecheck.</p>
<script type="module">
// Each step waits for what the page says through data attributes on its <html>: data-engine
// (loading, ready, or failed), data-busy (whether a command is on its way to the engine), data-t (the
// fake time), data-playing, data-lines, and data-commits; for the state that window.s4qlPage gives;
// or for a number of animation frames of the page. No step waits for a time; sitecheck stops a check
// that hangs.
//
// The page picks a random seed, and every check holds for any seed. Fake time goes on through the
// page's hook s4qlPage.skip, which advances the session at once, so the check does not wait minutes
// of real time.
//
// The address of this page has the version that the site was built with, if any, as version. The
// check loads run.js at that version, as the page does, and sitecheck checks the page's requests.
const version = new URLSearchParams(location.search).get("version") || "";
const query = version ? "?v=" + encodeURIComponent(version) : "";
const lines = [];
const say = (s) => lines.push(s);
let ok = true;
const expect = (cond, s) => {
  say((cond ? "ok   " : "FAIL ") + s);
  if (!cond) ok = false;
  return cond;
};

// cleanRequests says whether each of the texts of the page about the requests has words, and none
// of what only the instances know, such as that one is down, has crashed, or has stopped.
const cleanRequests = (texts) => texts.size > 0 && [...texts].every((s) => typeof s === "string" && s.trim() !== "" && !/\b(down|crashed|stopped|undefined|null)\b/i.test(s));

// clientWord matches the word client in any case. The page shows the calls of the engine's client as
// the requests that reach the app, and no text of the page says client.
const clientWord = /client/i;

const until = async (f) => {
  for (;;) {
    const v = f();
    if (v) return v;
    await new Promise((r) => setTimeout(r, 25));
  }
};

// load the page at the address in a frame, and wait until its engine is ready, or failed. The frame
// lies inside the window of Chromium, which sitecheck opens larger than it, because Chromium does not
// run the animation frames of a frame that is out of sight, and the page plays in them.
async function load(address) {
  const frame = document.createElement("iframe");
  frame.style.cssText = "position: fixed; top: 0; left: 0; width: 1280px; height: 900px; border: 0;";
  frame.src = address;
  document.body.appendChild(frame);
  await new Promise((r) => frame.addEventListener("load", r, { once: true }));
  const win = frame.contentWindow;
  const html = win.document.documentElement;
  await until(() => html.dataset.engine === "failed" || html.dataset.engine === "ready");
  return { frame, win, html };
}

// open the simulator page at the address, and fail unless its engine becomes ready.
async function open(address) {
  const { win, html } = await load(address);
  if (html.dataset.engine === "failed") throw new Error("the page failed: " + win.document.getElementById("failure").textContent);
  const $ = (sel) => win.document.querySelector(sel);
  const page = {
    win, html, $,
    get t() { return Number(html.dataset.t); },
    get lines() { return Number(html.dataset.lines || 0); },
    get commits() { return Number(html.dataset.commits || 0); },
    idle: () => html.dataset.busy === "false",
    instance: (name) => win.s4qlPage.state.instances.find((i) => i.instance === name),
    button: (name, a) => $(`[data-instance="${name}"] [data-a="${a}"]`),
    inst: (name) => $(`[data-instance="${name}"]`),
    // frames waits for n animation frames of the page.
    frames: async (n) => {
      for (let i = 0; i < n; i++) await new Promise((r) => win.requestAnimationFrame(r));
    },
    // skip fake time on by ms through the page's hook, and wait until the page shows it.
    skip: async (ms) => {
      const to = Math.floor(win.s4qlPage.t + ms) - 1;
      win.s4qlPage.skip(ms);
      await until(() => Number(html.dataset.t) >= to && html.dataset.busy === "false");
    },
    // skipUntil skips fake time a second at a time until f holds, for a change that the code makes in
    // its own time, and gives the fake time it took.
    skipUntil: async (f) => {
      const from = win.s4qlPage.t;
      while (!f()) await page.skip(1000);
      return win.s4qlPage.t - from;
    },
    // requests is what the page says of the requests: their target, the counts of what they got, and
    // their status, with whether the status is failing.
    requests: () => {
      const d = $("#requests").dataset;
      const c = { target: d.target, writes: Number(d.writes), reads: Number(d.reads), failed: Number(d.failed) };
      c.calls = c.writes + c.reads + c.failed;
      c.status = $("#requests-status-words").textContent;
      c.failing = $("#requests-status").dataset.failing === "true";
      return c;
    },
    // served and refused are what the instance in the diagram says that it served and refused.
    served: (name) => $(`[data-instance="${name}"] [data-f="calls"]`).textContent + "; refused " + $(`[data-instance="${name}"] [data-f="refused"]`).textContent,
    // send the requests to the instance with their switch, and wait until the page has the state
    // after it.
    send: async (name) => {
      const b = $(`#requests [data-target="${name}"]`);
      await until(() => !b.disabled && html.dataset.busy === "false");
      const before = page.lines;
      b.click();
      await until(() => page.lines > before && html.dataset.busy === "false");
    },
    // sql runs the statement in the box for SQL, by its button Run or, with keys, by Ctrl+Enter in
    // the box, and waits until the page has its answer, or lets it wait. It gives the line of the box.
    sql: async (text, keys) => {
      const area = $("#sql-text");
      area.value = text;
      area.dispatchEvent(new win.Event("input", { bubbles: true }));
      await until(() => html.dataset.busy === "false" && !$("#sql-run").disabled);
      if (keys) area.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", ctrlKey: true, bubbles: true, cancelable: true }));
      else $("#sql-run").click();
      await until(() => html.dataset.busy === "false" && ($("#sql").dataset.pending === "false" || $("#sql").dataset.waiting === "true"));
      return $("#sql-status").textContent;
    },
    // press the action's button of the instance once it is enabled, and wait until the page has the
    // state after it: an action always adds its line to the log.
    press: async (name, a) => {
      const b = page.button(name, a);
      await until(() => !b.disabled && html.dataset.busy === "false");
      const before = page.lines;
      b.click();
      await until(() => page.lines > before && html.dataset.busy === "false");
    },
  };
  return page;
}

// unit checks of run.js: the seed, the clock, and the lines of the log.
async function unit() {
  const R = await import("/simulator/run.js" + query);
  const seeds = Array.from({ length: 1000 }, () => R.newSeed());
  expect(seeds.every((s) => Number.isSafeInteger(s) && s >= 0), "a new seed is a whole number below 2^53");
  const clocks = [R.clock(0), R.clock(61234), R.clock(3723400), R.offset(60000), R.offset(-45200)];
  expect(JSON.stringify(clocks) === JSON.stringify(["0:00.0", "1:01.2", "1:02:03.4", "+60 s", "−45 s"]), `times read as a clock (${clocks.join(", ")})`);

  // The instance without the lease refuses every call, and takes one line for a spell of refusals.
  const refused = (t, inst, reason) => ({ t, kind: "call", what: "refused", instance: inst, process: inst, op: "read", error: "no valid lease: " + reason });
  const events = [
    refused(1, "b", "not_holder"), refused(2, "b", "not_holder"), refused(3, "b", "not_holder"),
    refused(4, "a", "lease_expired_monotonic"), refused(5, "a", "lease_expired_monotonic"), refused(6, "a", "not_holder"),
    { t: 7, kind: "call", what: "served", instance: "b", process: "b", op: "read", keys: [1] },
    refused(8, "b", "not_holder"),
  ];
  let tell = R.teller();
  const shown = events.filter((e) => tell(e).tier).map((e) => e.t);
  expect(JSON.stringify(shown) === JSON.stringify([1, 4, 6, 7, 8]), `a spell of refusals takes one line for each reason, until the instance serves (lines at ${shown.join(", ")})`);

  // A run of failures of the requests of one kind takes one line when it begins. A request that is
  // served, and sending the requests to the other instance, end the run. The events are those of the
  // engine's client.
  tell = R.teller();
  const call = (t, inst, what, error) => ({ t, kind: "call", caller: "client", what, instance: inst, process: inst, op: "read", sql: "select code from barcodes where code = ?", args: [5712345678903], error });
  // write of the key 7, in place of the read of a call.
  const write = (e) => ({ ...e, op: "write", value: 7, sql: "insert into barcodes (code) values (?)", args: [7] });
  const clientEvents = [
    call(1, "a", "down", "the process of the instance has crashed"), call(2, "a", "down", "the process of the instance has crashed"),
    call(3, "a", "refused", "no valid lease: not_holder"), call(4, "a", "refused", "no valid lease: not_holder"),
    { t: 5, kind: "action", what: "done", do: "client", instance: "b" },
    call(6, "b", "refused", "no valid lease: not_holder"), call(7, "b", "refused", "no valid lease: not_holder"),
    call(8, "b", "served", ""), call(9, "b", "refused", "no valid lease: not_holder"),
  ];
  const clientLines = clientEvents.map((e) => tell(e)).filter((w) => w.tier).map((w) => w.text);
  const wantLines = ["A request gets no answer from a.", "A request gets an error from a: no lease.", "You send the requests to b.", "A request gets an error from b: no lease.", "b serves select code from barcodes where code = 5712345678903: 0 rows.", "A request gets an error from b: no lease."];
  expect(JSON.stringify(clientLines) === JSON.stringify(wantLines), `a run of failures of the requests takes one line, until one is served or they go to the other instance (${clientLines.join(" | ")})`);
  const failures = [call(1, "a", "down", "the process of the instance has crashed"), call(2, "b", "refused", "no valid lease: not_holder"), write(call(3, "a", "lost", "crashed"))].map((e) => R.requestFailure(e));
  const words = failures.map((f) => f.words);
  expect(JSON.stringify(words) === JSON.stringify(["no answer from a", "error from b: no lease", "no answer from a, write outcome unknown"]), `a failure of a request in a few words (${words.join(" | ")})`);
  expect(failures[2].line === "A request gets no answer from a: insert into barcodes (code) values (7), outcome unknown.", `a write that gets no answer names its statement in the log (${failures[2].line})`);

  // The log shows the statement of a request with its arguments in place of its parameters, and a
  // commit with the statements of its commit object.
  expect(R.sqlText("select id from t where id > ? and v = ? and w = ?", [5, "it's", null]) === "select id from t where id > 5 and v = 'it''s' and w = null", "the arguments of a statement take the places of its parameters");
  tell = R.teller();
  const name = "0123456789abcdef".repeat(4);
  const stream = [
    { t: 1, kind: "request", what: "applied", purpose: "upload", object: { commit: { name, keys: [1], statements: [{ sql: "create table barcodes (code integer primary key) strict, without rowid" }, { sql: "insert into barcodes (code) values (?)", args: [1] }] } } },
    { t: 2, kind: "core", event: "commit", instance: "a", process: "a", attrs: { outcome: "committed", "commit.name": name } },
    { ...call(3, "a", "served", ""), keys: [5712345678903] },
    { ...call(4, "a", "served", "no such table: barcodes"), keys: [] },
  ].map((e) => tell(e)).filter((w) => w.tier).map((w) => w.text);
  const wantStream = ["a commits create table barcodes (code integer primary key) strict, without rowid; insert into barcodes (code) values (1) as 01234567.",
    "a serves select code from barcodes where code = 5712345678903: 1 row.", "a serves select code from barcodes where code = 5712345678903: no such table: barcodes."];
  expect(JSON.stringify(stream) === JSON.stringify(wantStream), `the log shows the SQL of commits and reads (${stream.join(" | ")})`);

  // A delete is in the log as its commit, and a read of a deleted row that finds none says so. A
  // commit object of a delete names the key that it deletes. A delete that gets no answer has an
  // unknown outcome, as a write has.
  tell = R.teller();
  const gone = 5737330940083;
  const deleteName = "fedcba9876543210".repeat(4);
  const deletes = [
    { t: 1, kind: "request", what: "applied", purpose: "upload", object: { commit: { name: deleteName, deletes: [gone], statements: [{ sql: "delete from barcodes where code = ?", args: [gone] }] } } },
    { t: 2, kind: "core", event: "commit", instance: "a", process: "a", attrs: { outcome: "committed", "commit.name": deleteName } },
    { ...call(3, "a", "served", ""), args: [gone], expect: "none", keys: [] },
    { ...call(4, "a", "served", ""), args: [gone], expect: "row", keys: [] },
  ].map((e) => tell(e)).filter((w) => w.tier).map((w) => w.text);
  const wantDeletes = [`a commits delete from barcodes where code = ${gone} as fedcba98.`,
    `a serves select code from barcodes where code = ${gone}: 0 rows, as deleted.`, `a serves select code from barcodes where code = ${gone}: 0 rows.`];
  expect(JSON.stringify(deletes) === JSON.stringify(wantDeletes), `the log shows a delete and a read of its row (${deletes.join(" | ")})`);
  const labels = [R.commitKeysText({ deletes: [gone] }), R.commitKeysText({ keys: [7] }), R.commitKeysText({})];
  expect(JSON.stringify(labels) === JSON.stringify([`delete ${gone}`, "key 7", "no rows"]), `a commit object says what it deletes (${labels.join(" | ")})`);
  const lostDelete = R.requestFailure({ ...call(5, "a", "lost", "crashed"), op: "delete", sql: "delete from barcodes where code = ?", args: [gone] });
  expect(lostDelete.words === "no answer from a, write outcome unknown" && lostDelete.line === `A request gets no answer from a: delete from barcodes where code = ${gone}, outcome unknown.`, `a delete that gets no answer has an unknown outcome (${lostDelete.line})`);

  // The status of the requests is what the latest that ended got: ok from the instance that served
  // or committed it, or the words of its failure, which is the only state that is failing.
  const statuses = [{ ...call(1, "a", "served"), keys: [1] }, { ...call(2, "b", "committed"), op: "write", value: 7 }, call(3, "a", "down", "the process of the instance has crashed"), call(4, "b", "refused", "no valid lease: not_holder")]
    .map((e) => R.requestStatus(e)).map((st) => `${st.words} (${st.failing ? "failing" : "not failing"})`);
  expect(JSON.stringify(statuses) === JSON.stringify(["ok from a (not failing)", "ok from b (not failing)", "no answer from a (failing)", "error from b: no lease (failing)"]), `the status of the requests after one ends (${statuses.join(" | ")})`);

  // From outside the app, a request shows only that no answer came, or the error that the instance
  // gave. One that its target could not take and one that was on it when it crashed read the same,
  // whatever the reason.
  const silent = ["the instance has not started", "the process of the instance has crashed", "the database of the instance could not be opened",
    "the database of the instance is not open", "the database of the instance is closed", "the database of the instance has stopped"]
    .flatMap((error) => ["down", "lost"].flatMap((what) => ["read", "write"].map((op) => R.requestFailure((op === "write" ? write : (e) => e)(call(1, "a", what, error))))));
  expect(new Set(silent.map((f) => f.words + " | " + f.line)).size === 2, `no answer reads the same for every reason, once for a read and once for a write (${[...new Set(silent.map((f) => f.words))].join(" | ")})`);

  // Every outcome and error that the engine can give a call of its client has plain words for the
  // request, without what only the instance knows, and none of them says client.
  const texts = new Set([R.NO_REQUESTS]);
  const outcomes = [
    ["down", ""], ["lost", ""], ["unknown", "the outcome of the commit is unknown"], ["not_committed", "local I/O failure"],
    ["abandoned", "no such table"], ["busy", "the cache is busy"], ["timed_out", "context deadline exceeded"],
    ["stopped", "the instance has stopped: closed"], ["stopped", "the instance has stopped: local I/O failure: disk"],
    ["stopped", "the instance has stopped: the position of the cache is not in the log"], ["stopped", "the instance has stopped: the log is broken"],
    ["stopped", "the instance has stopped: newer version"], ["failed", "the instance has no database open"], ["failed", "local I/O failure: read"],
    ["failed", "something else"], ["something new", ""],
    ...[...Object.keys(R.REASONS), "some_new_reason", ""].map((r) => ["refused", "no valid lease: " + r]),
  ];
  for (const [what, error] of outcomes) {
    for (const op of ["read", "write"]) {
      const f = R.requestFailure((op === "write" ? write : (e) => e)(call(1, "a", what, error)));
      texts.add(f.words).add(f.line).add(R.requestStatus((op === "write" ? write : (e) => e)(call(1, "a", what, error))).words);
    }
  }
  for (const what of ["committed", "served"]) texts.add(R.requestStatus({ ...call(1, "a", what, ""), keys: [1] }).words);
  for (const text of clientLines) texts.add(text);
  expect(cleanRequests(texts), `every outcome of a request has plain words that can be known from outside the app (${texts.size} texts)`);
  const saysClient = [...texts].filter((s) => clientWord.test(s));
  expect(saysClient.length === 0, `no words of the requests, and no line of the log about them, say client (${saysClient.join(" | ") || texts.size + " texts"})`);
  const stops = ["closed", "local I/O failure: spool: closed", "the log is broken: missing"].map((c) => R.requestFailure(call(1, "a", "stopped", "the instance has stopped: " + c)).words);
  expect(JSON.stringify(stops) === JSON.stringify(["error from a: database closed", "error from a: local failure", "error from a: log broken"]), `an instance that has stopped answers with its first cause (${stops.join(" | ")})`);

  // Opens that fail take one line until the database opens, and again when they fail after that.
  tell = R.teller();
  const proc = (t, what) => ({ t, kind: "process", what, instance: "a", process: "a", holder: "h" + t });
  const opens = [proc(1, "open_failed"), proc(2, "open_failed"), proc(3, "opened"), proc(4, "open_failed")].map((e) => tell(e).tier);
  expect(JSON.stringify(opens) === JSON.stringify(["story", null, null, "story"]), `a spell of failed opens ends when the database opens (${opens.join(", ")})`);

  // The log names the instance, never the process: a restart of a is a again, and a line about two
  // processes of one instance stays true.
  tell = R.teller();
  const opened = (t, inst, proc, holder) => ({ t, kind: "process", what: "opened", instance: inst, process: proc, holder });
  const lease = (t, inst, proc, attrs) => ({ t, kind: "core", event: "lease", instance: inst, process: proc, attrs });
  const restartLines = [
    opened(1, "a", "a", "h1"),
    { t: 2, kind: "process", what: "started", instance: "a", process: "a2" },
    opened(3, "a", "a2", "h2"),
    lease(4, "a", "a2", { "lease.transition": "lost", "lease.holder": "h1" }),
    lease(5, "a", "a2", { "lease.transition": "taken", outcome: "taken", "lease.previous_holder": "h1" }),
    opened(6, "b", "b", "h3"),
    lease(7, "b", "b", { "lease.transition": "taken", outcome: "taken", "lease.previous_holder": "h2" }),
    { t: 8, kind: "core", event: "commit", instance: "a", process: "a3", attrs: { outcome: "unknown", "commit.name": "0123456789abcdef" } },
    lease(9, "a", "a2", { "lease.transition": "lost", "lease.holder": "h2" }),
  ].map((e) => tell(e)).filter((w) => w.tier).map((w) => w.text);
  const wantRestart = ["a starts again, on the cache that it left when it crashed.", "a learns that its lease from before has not run out yet.", "a takes the lease again.", "b takes the lease over from a.", "a does not know whether its commit 01234567 went through.", "a learns that it lost the lease."];
  expect(JSON.stringify(restartLines) === JSON.stringify(wantRestart), `the log names the instance of a process after a restart (${restartLines.join(" | ")})`);
  const resets = [[{ what: "done" }, true], [{ what: "done" }, false], [{ what: "ignored", text: "the process of the instance has crashed" }, false]]
    .map(([e, first]) => R.resetLine({ kind: "action", instance: "a", ...e }, first).text);
  expect(JSON.stringify(resets) === JSON.stringify(["You reset the clocks of a.", "", "You reset the clocks of a. Ignored: the process of the instance has crashed."]), `the steps of a reset of the clocks say the reset once, and a step that does not happen (${resets.join(" | ")})`);
  expect(JSON.stringify(["a", "a2", "b13", ""].map(R.instanceOf)) === JSON.stringify(["a", "a", "b", ""]), "the instance of a process is its name without the number of its restart");

  // A stale read after both clocks went wrong takes one plain line a spell; a violation that is not excused is
  // an alarm on every event.
  tell = R.teller();
  const check = (t, excused) => ({ t, kind: "check", what: "violated", invariant: "fresh", excused, instance: "a", process: "a", text: "missed" });
  const told = [check(1, true), check(2, true), check(3, false), check(4, false)].map((e) => tell(e));
  const tiers = told.map((w) => w.tier);
  expect(JSON.stringify(tiers) === JSON.stringify(["story", null, "alarm", "alarm"]), `a stale read that the design excuses takes one line, and a violation is an alarm (${tiers.join(", ")})`);
  expect(told[0].text === "a serves a stale read after its clocks were paused, which the spec allows.", `the line of a stale read names the pause of the clocks (${told[0].text})`);

  // The sound of the page: each important event has one figure, the visitor's Stop, Start, and
  // Restart sound once, at the action, and the requests sound when their status changes, not at
  // each request. Every note is short.
  const S = await import("/simulator/sound.js" + query);
  const hear = S.listener();
  const sounds = [
    lease(1, "a", "a", { "lease.transition": "taken", outcome: "taken" }),
    call(2, "a", "served"), call(3, "a", "committed"),
    { t: 4, kind: "action", what: "done", do: "hangNetwork", instance: "a", on: true },
    call(5, "a", "timed_out"), call(6, "a", "timed_out"), call(7, "a", "served"),
    { t: 8, kind: "process", what: "crashed", instance: "a", process: "a" },
    { t: 8, kind: "action", what: "done", do: "crash", instance: "a" },
    call(9, "a", "down"), call(10, "a", "down"),
    lease(11, "b", "b", { "lease.transition": "taken", outcome: "taken", "lease.previous_holder": "h1" }),
    { t: 12, kind: "action", what: "done", do: "restart", instance: "a" },
    { t: 12, kind: "process", what: "started", instance: "a", process: "a2" },
    opened(12, "a", "a2", "h2"),
    { t: 13, kind: "action", what: "done", do: "close", instance: "a" },
    { t: 14, kind: "process", what: "closed", instance: "a", process: "a2" },
    { t: 15, kind: "process", what: "stopped", instance: "b", process: "b" },
    { t: 17, kind: "process", what: "closed", instance: "b", process: "b" },
    opened(19, "b", "b", "h4"),
    { t: 20, kind: "action", what: "ignored", do: "restart", instance: "b" },
    check(21, true), check(22, false),
  ].map((e) => hear(e)).filter(Boolean);
  const wantSounds = ["blip", "failing", "recovered", "down", "failing", "takeover", "up", "stop", "stop", "up", "alarm"];
  expect(JSON.stringify(sounds) === JSON.stringify(wantSounds), `the important events have their sounds, each once (${sounds.join(", ")})`);
  const notes = Object.values(S.FIGURES).flatMap((f) => f.notes);
  expect(Object.keys(S.FIGURES).every((k) => wantSounds.includes(k)) && notes.every(([hz, ms]) => hz > 0 && ms >= 25 && ms <= 90), `every figure is heard, and its notes are 25 to 90 ms (${notes.length} notes)`);

  // The volume of a burst, as turbo gives, rendered offline through the page's player: every kind
  // every 10 ms for 3 s. Its peak stays at most 0.06 (−24 dBFS) without the alarm, and 0.1 with it.
  const burst = async (kinds) => {
    const ctx = new OfflineAudioContext(1, 48000 * 3.5, 48000);
    const master = ctx.createGain();
    master.gain.value = S.MASTER;
    master.connect(ctx.destination);
    const player = S.player(ctx, master);
    let played = 0, ticked = 0;
    for (let i = 0; i < 300; i++) {
      // The ticks of every kind every 10 ms, the scan and the void at each of their pitches, under
      // the figures.
      for (const k of ticks) if (player.tick(k, k === "scan" || k === "void" ? S.SCANS[i % S.SCANS.length] : 0, i / 100)) ticked++;
      for (const k of kinds) if (player.play(k, i / 100)) played++;
    }
    let peak = 0;
    for (const v of (await ctx.startRendering()).getChannelData(0)) peak = Math.max(peak, Math.abs(v));
    return { played, ticked, peak };
  };
  const kinds = Object.keys(S.FIGURES);
  let ticks = [];
  const [quiet, quietAlarmed] = [await burst(kinds.filter((k) => k !== "alarm")), await burst(kinds)];
  ticks = Object.keys(S.TICKS);
  const [calm, alarmed] = [await burst(kinds.filter((k) => k !== "alarm")), await burst(kinds)];
  const dB = (x) => (20 * Math.log10(x)).toFixed(1) + " dBFS";
  expect(calm.peak > 0 && calm.peak <= 0.06 && calm.played <= 4 * 3 && calm.ticked > 0 && calm.ticked <= 3 / S.TICK_SPACING, `a burst of sounds with ticks under them peaks at ${dB(calm.peak)} (${dB(quiet.peak)} without the ticks), and plays ${calm.played} sounds and ${calm.ticked} ticks in 3 s`);
  expect(alarmed.peak > 0 && alarmed.peak <= 0.1, `a burst of sounds with the alarm and ticks peaks at ${dB(alarmed.peak)} (${dB(quietAlarmed.peak)} without the ticks)`);

  // Each tick alone: the scan, at every pitch, at most at the level of a figure, the void below the
  // scan, the select in the background, and the error tone. Ticks come at most every TICK_SPACING, and
  // the error tone at most every ERROR_SPACING.
  const alone = async (kind, hz) => {
    const ctx = new OfflineAudioContext(1, 48000 * 0.5, 48000);
    const master = ctx.createGain();
    master.gain.value = S.MASTER;
    master.connect(ctx.destination);
    S.player(ctx, master).tick(kind, hz, 0.01);
    let peak = 0;
    for (const v of (await ctx.startRendering()).getChannelData(0)) peak = Math.max(peak, Math.abs(v));
    return peak;
  };
  const scans = await Promise.all(S.SCANS.map((hz) => alone("scan", hz)));
  const voids = await Promise.all(S.SCANS.map((hz) => alone("void", hz)));
  const [select, error] = [Math.max(await alone("select"), ...(await Promise.all(S.SCANS.map((hz) => alone("select", hz))))), await alone("error")];
  expect(Math.max(...scans) <= S.MASTER && Math.min(...scans) > 0 && select < Math.min(...scans) / 1.5 && error > 0 && error < S.MASTER,
    `a scan peaks at ${dB(Math.max(...scans))}, a select at ${dB(select)}, and an error tone at ${dB(error)}, against ${dB(S.MASTER)} for a figure`);
  expect(Math.max(...voids) < Math.min(...scans) && Math.min(...voids) > select && S.TICKS.void.notes.length === 2 && S.TICKS.void.notes[1][0] < S.TICKS.void.notes[0][0],
    `a void, a note and a drop, peaks at ${dB(Math.max(...voids))}, below a scan and above a select`);
  const rateCtx = new OfflineAudioContext(1, 4800, 48000);
  const rate = S.player(rateCtx, rateCtx.destination);
  const errors = Array.from({ length: 300 }, (_, i) => rate.tick("error", 0, i / 100)).filter(Boolean).length;
  expect(errors <= 3 / S.ERROR_SPACING + 1, `a long run of failing requests gives ${errors} error tones in 3 s`);

  // Each request that ends ticks: an insert that commits scans at the note of its key, a select at
  // the note of the key that it selects, lower and shorter if it finds no row, and a failure gives
  // the error tone. The same key always has the same note, and keys in a row wander over the notes.
  const ticked = [
    { ...call(1, "a", "started"), op: "write", value: 7 },
    write(call(2, "a", "committed")), { ...call(3, "a", "served"), args: [7], keys: [7] }, { ...call(4, "a", "served"), args: [7], keys: [] },
    call(5, "a", "refused", "no valid lease: not_holder"), call(6, "a", "down", "crashed"),
    { ...call(7, "a", "committed"), op: "delete", sql: "delete from barcodes where code = ?", args: [7] },
  ].map((e) => S.tickOf(e)).filter(Boolean);
  const kindsTicked = ticked.map((k) => k.kind).join(", ");
  expect(kindsTicked === "scan, select, miss, error, error, void" && ticked[5].hz === S.keyNote(7), `each request that ends ticks, a delete that commits at the note of its key (${kindsTicked})`);
  const run = Array.from({ length: 12 }, (_, i) => S.SCANS.indexOf(S.keyNote(i + 1)));
  expect(ticked[0].hz === S.keyNote(7) && ticked[1].hz === S.keyNote(7) && ticked[2].hz === S.keyNote(7) / 2 && S.keyNote(7) === S.keyNote(7)
    && run.every((i) => i >= 0) && new Set(run).size >= 4 && run.some((x, i) => i > 0 && x < run[i - 1]) && S.SCANS.every((hz) => hz >= 1200 && hz <= 3000),
    `an insert and the selects of its key take its note, an octave down for a select that finds no row, and the keys 1 to 12 wander over the notes (${run.join(" ")})`);

  // The box for SQL: its statements are in the log on one line, cut when long, with their rows or
  // the engine's error, and the simulator's refusal; a commit is the core's line. They tick: one that
  // is served or committed with a tick of its own, no louder than a select, and one that fails or is
  // refused with the error tone.
  const boxCall = (t, what, extra) => ({ t, kind: "call", caller: "box", what, instance: "a", process: "a", op: "sql", sql: "select k from t", ...extra });
  const boxEvents = [
    { t: 1, kind: "action", what: "done", do: "sql", instance: "a", sql: "select   k\n from t" },
    boxCall(1, "started"), boxCall(2, "served", { count: 1204, columns: ["k"], rows: [] }),
    { t: 3, kind: "action", what: "ignored", do: "sql", sql: "delete from barcodes", text: "barcodes is the app's table, so the box can only select from it" },
    boxCall(4, "failed", { error: "no such column: x" }),
    boxCall(5, "committed", { sql: "create table if not exists t (k integer primary key) strict, without rowid" }),
    boxCall(6, "committed", { commit: "0123456789abcdef".repeat(4) }),
  ];
  tell = R.teller();
  const boxLines = boxEvents.map((e) => tell(e)).filter((w) => w.tier).map((w) => w.text);
  const wantBox = ["You send select k from t to a.", "a serves select k from t: 1,204 rows.",
    "You send delete from barcodes. Ignored: barcodes is the app's table, so the box can only select from it.", "On a, select k from t fails: no such column: x.",
    "a runs create table if not exists t (k integer primary key) strict, without rowid: nothing to commit."];
  expect(JSON.stringify(boxLines) === JSON.stringify(wantBox), `the log tells the statements of the box (${boxLines.join(" | ")})`);
  const long = R.boxText("x".repeat(300));
  expect([...long].length === 201 && long.endsWith("…"), "a long statement is cut in the log");
  const boxTicks = [...boxEvents, boxCall(7, "abandoned", { error: "UNIQUE constraint failed: t.k" })].map((e) => S.tickOf(e)).map((k) => (k ? k.kind : "none")).join(", ");
  expect(boxTicks === "none, none, box, error, error, box, box, error", `a statement of the box ticks when it ends, and so does a refusal (${boxTicks})`);
  const boxPeak = await alone("box");
  expect(boxPeak > 0 && boxPeak <= select * 1.001 && S.TICKS.box.notes.every(([hz, ms]) => hz > 0 && ms <= 30),
    `a statement of the box ticks at ${dB(boxPeak)}, no louder than a select at ${dB(select)}`);
}

async function check() {
  await unit();

  const address = "/simulator/";
  forget();
  const p = await open(address);
  const play = p.$("#play"), turbo = p.$("#turbo");
  const requestTexts = new Set();
  const logTexts = new Set();
  const stripTexts = new Set();

  // Collect every text that the page shows about the requests, their status and their lines in the
  // log, every line of the log, and every text of the strip of the requests.
  const collect = () => {
    requestTexts.add(p.$("#requests-status-words").textContent);
    stripTexts.add(p.$("#requests").textContent);
    for (const li of p.$("#log").children) {
      const text = li.querySelector(".text");
      if (text) logTexts.add(text.textContent);
      if (text && text.textContent.startsWith("A request")) requestTexts.add(text.textContent);
    }
  };
  collect();
  new p.win.MutationObserver(collect).observe(p.$("#requests"), { subtree: true, childList: true, characterData: true });
  new p.win.MutationObserver(collect).observe(p.$("#log"), { childList: true });

  // noClient checks that no text of the page says client: its title, the descriptions in its head,
  // its text, the labels, titles, and alternative texts of its elements, every line that the log has
  // had, and every text that the strip of the requests has shown.
  const noClient = (when) => {
    const doc = p.win.document;
    const now = [doc.title, doc.body.textContent];
    for (const el of doc.querySelectorAll("meta[content]")) now.push(el.getAttribute("content"));
    for (const attr of ["aria-label", "aria-description", "title", "alt", "placeholder"]) {
      for (const el of doc.querySelectorAll(`[${attr}]`)) now.push(el.getAttribute(attr));
    }
    const found = [...now, ...logTexts, ...stripTexts].filter((s) => clientWord.test(s));
    expect(found.length === 0, `${when}, no text of the page says client (${found.map((s) => s.slice(0, 120)).join(" | ") || logTexts.size + " lines of the log"})`);
  };

  // noProcess checks that the page shows no name of a process, such as a2, but the instance: in the
  // text of the page now, and in every line that the log has had.
  // A process of a restart is the instance and a number from 2; at most three digits, so that the
  // short name of a commit object, eight hexadecimal digits, does not match.
  const processName = /\b[a-e]([2-9]|[1-9][0-9]{1,2})\b/;
  const noProcess = (when) => {
    const now = p.win.document.body.innerText.split("\n").filter((s) => processName.test(s));
    const logged = [...logTexts].filter((s) => processName.test(s));
    expect(now.length === 0 && logged.length === 0, `${when}, the page names no process, only instances (${[...now, ...logged].join(" | ") || logTexts.size + " lines of the log"})`);
  };

  // The page names the commit that the engine is built from, which it reads from build.json.
  const built = await until(() => p.$("#build a code"));
  expect(/^[0-9a-f]{7}$/.test(built.textContent), `the page names the commit it is built from (${built.textContent})`);

  // The page waits at zero until Play.
  expect(p.t < 1000 && !p.win.s4qlPage.playing && p.html.dataset.playing === "false", `the page starts paused at ${p.t} ms`);
  expect(!play.disabled && play.textContent.trim() === "Play", "Play is offered");
  expect(turbo.getAttribute("aria-pressed") === "true" && p.win.s4qlPage.turbo, "turbo is on");
  turbo.click();
  expect(turbo.getAttribute("aria-pressed") === "false" && !p.win.s4qlPage.turbo, "turbo is off after a click");
  const sound = p.$("#sound");
  expect(sound && !sound.disabled && sound.getAttribute("aria-pressed") === "false" && sound.dataset.audio === "none", `sound is off, and the page has made no audio context (${sound && sound.dataset.audio})`);
  expect(p.instance("a") && p.instance("b") && p.win.s4qlPage.state.instances.length === 2, "the session has the two instances a and b");
  // requestsEdge is the instance that the edge of the requests goes into, by what the page draws: its
  // edge to that instance is on and has its arrow, and the instance says that the requests come to
  // it. It is empty if no instance has all three, or if the edges are not drawn, and both letters if
  // both have.
  const requestsEdge = () => p.win.getComputedStyle(p.$(".fork")).display === "none" ? "" : ["a", "b"].filter((name) => {
    const w = p.$(`[data-wire="${name}"]`);
    return w.dataset.on === "true" && p.win.getComputedStyle(w, "::after").content !== "none" && p.inst(name).dataset.requests === "true";
  }).join("");
  const switchA = p.$('#requests [data-target="a"]');
  expect(p.requests().target === "a" && switchA.getAttribute("aria-pressed") === "true" && requestsEdge() === "a", `the requests go to a, their switch shows a on, and their edge goes into a (${requestsEdge() || "none"})`);
  // Each action's accessible name says what it acts on: its instance, by its letter. The letter a is
  // also a word, so each name of a must be that of b with b changed to a.
  const label = (name, a) => p.button(name, a).getAttribute("aria-label") || "";
  const unnamed = [...p.inst("b").querySelectorAll("[data-a]")].map((b) => b.dataset.a)
    .filter((a) => !/\bb\b/.test(label("b", a)) || label("a", a) !== label("b", a).replace(/\bb\b/g, "a")).map((a) => `${label("a", a)} / ${label("b", a)}`);
  expect(unnamed.length === 0, `the accessible name of each action names its instance (${unnamed.join(" | ") || "all of them"})`);
  expect(p.requests().status === "no requests yet" && !p.requests().failing, `before the first request, the status of the requests is neutral (${p.requests().status})`);
  noClient("at zero");
  const t0 = p.t;
  await p.frames(30);
  expect(p.t === t0 && p.idle(), `fake time stays at ${t0} ms for 30 frames without Play`);

  // Play advances fake time by the real time that passed.
  play.click();
  await until(() => p.win.s4qlPage.lastStep && p.t > t0);
  const step = p.win.s4qlPage.lastStep;
  expect(p.win.s4qlPage.playing && play.textContent.trim() === "Pause", "Play plays, and becomes Pause");
  expect(step.fake === step.real && step.real > 0 && step.real <= 250, `a step without turbo advances fake time by the real time (${step.fake.toFixed(1)} ms for ${step.real.toFixed(1)} ms)`);

  // Turbo makes each step advance five times the real time, and the log and the commits grow.
  turbo.click();
  expect(turbo.getAttribute("aria-pressed") === "true", "turbo is pressed");
  await until(() => p.win.s4qlPage.lastStep.fake !== p.win.s4qlPage.lastStep.real);
  const fast = p.win.s4qlPage.lastStep;
  expect(Math.abs(fast.fake - 5 * fast.real) < 1e-6, `a step with turbo advances five times the real time (${fast.fake.toFixed(1)} ms for ${fast.real.toFixed(1)} ms)`);
  await until(() => p.commits > 0 && p.lines > 0);
  expect(true, `playing gives lines in the log (${p.lines}) and commit objects (${p.commits})`);
  turbo.click();
  expect(turbo.getAttribute("aria-pressed") === "false", "turbo is off again");
  await until(() => p.requests().writes + p.requests().reads > 0);
  expect(p.served("b") === "0 inserts, 0 deletes, 0 selects; refused 0", `the requests are served by a from the start (${JSON.stringify(p.requests())}), and b gets no call (${p.served("b")})`);
  await until(() => p.requests().status === "ok from a");
  expect(!p.requests().failing, "while a serves the requests, their status is ok from a, and not failing");

  // Pause holds fake time.
  play.click();
  await until(() => p.idle());
  const held = p.t;
  await p.frames(30);
  expect(!p.win.s4qlPage.playing && p.t === held && play.textContent.trim() === "Play", `Pause holds fake time at ${held} ms for 30 frames`);

  await dancer(p);
  await soundWakes(p);

  await sqlBox(p);

  // Each action on a, while paused: its effect in the state, and switched off again, gone.
  const a = () => p.instance("a");
  // The engine names two of the faults by the network, but they act only on the connection of the
  // instance to S3, and the page names them so.
  const logged = (text) => [...p.$("#log").children].some((li) => li.querySelector(".text")?.textContent === text);
  // The buttons of the faults sit on the edge or the disk that they act on, which shows the fault:
  // its data attribute, and how it looks, from the computed styles of its line, its cut, and its
  // frame, so that the check sees what a visitor sees.
  const look = (edge) => {
    const cs = (el, pseudo) => p.win.getComputedStyle(el, pseudo);
    if (edge.dataset.edge === "s3") {
      const cut = edge.querySelector(".cut");
      return [cs(edge, "::before").backgroundImage, cs(cut).backgroundColor, cs(cut).borderTopStyle].join(" | ");
    }
    return [cs(edge).borderTopStyle, cs(edge, "::after").content, cs(edge, "::after").backgroundImage].join(" | ");
  };
  const toggles = [
    ["hang", "networkHung", "Hang", "s3", "hung", "You hang the connection of a to S3.", "The connection of a to S3 no longer hangs."],
    ["disconnect", "networkDisconnected", "Disconnect", "s3", "disconnected", "You disconnect a from S3.", "You connect a to S3 again."],
    ["disk", "diskFailing", "Error", "disk", "failing", "You make the disk of a fail.", "The disk of a works again."],
  ];
  const looks = {};
  for (const [name, flag, label, kind, attr, onLine, offLine] of toggles) {
    const edge = p.inst("a").querySelector(`[data-edge="${kind}"]`);
    const before = look(edge);
    await p.press("a", name);
    const on = !!a()[flag] && p.button("a", name).getAttribute("aria-pressed") === "true" && logged(onLine);
    const edgeOn = edge.dataset[attr] === "true" && look(edge) !== before;
    looks[name] = look(edge);
    await p.press("a", name);
    const off = !a()[flag] && p.button("a", name).getAttribute("aria-pressed") === "false" && logged(offLine);
    expect(on && off && p.button("a", name).textContent === label, `${label} switches ${flag} of a on, shows the button pressed, says "${onLine}", and switches it off again ("${offLine}")`);
    expect(edgeOn && edge.dataset[attr] === "false" && look(edge) === before, `the ${kind === "s3" ? "edge of a to S3" : "disk of a"} shows that it is ${attr} while ${label} is on, and looks as before once it is off`);
    if (kind === "s3") looks.working = before;
  }
  // Working, hung, and disconnected look different at a glance, without a label.
  const s3Looks = [looks.working, looks.hang, looks.disconnect];
  expect(new Set(s3Looks).size === 3, `the edge to S3 looks different working, hung, and disconnected (${s3Looks.join(" / ")})`);
  // The clock actions: each has its effect in the state, its opposite or Reset clocks undoes it, and
  // the clocks of the instance say how they differ from normal.
  const wall = () => a().wall - p.win.s4qlPage.state.t;
  const clocks = () => p.inst("a").querySelector('[data-f="clocks"]').textContent;
  const pressed = (name) => p.button("a", name).getAttribute("aria-pressed") === "true";
  const bothPaused = () => a().wallStopped && a().monotonicStopped && pressed("pause");
  const bothRun = () => !a().wallStopped && !a().monotonicStopped && !pressed("pause");
  expect(clocks() === "normal" && bothRun() && p.button("a", "reset").disabled, `untouched, the clocks of a read ${clocks()}, Pause is not pressed, and Reset clocks is off`);
  await p.press("a", "forward");
  const ahead = wall(), aheadText = clocks();
  await p.press("a", "back");
  const back = wall();
  expect(Math.abs(ahead - 5000) < 1 && aheadText === "wall +5 s" && Math.abs(back) < 1 && clocks() === "normal"
    && logged("You move the wall clock of a forward 5 s.") && logged("You move the wall clock of a back 5 s."),
    `Wall +5 s and Wall −5 s move the wall clock of a forward (${ahead.toFixed(3)}, ${aheadText}) and back (${back.toFixed(3)}, ${clocks()})`);

  // A pause after a jump: both clocks stand still, so the wall clock falls behind by the fake time
  // that passes, and Pause pressed again starts both.
  await p.press("a", "back");
  await p.press("a", "pause");
  const pausedText = clocks(), pausedBoth = bothPaused();
  await p.skip(5000);
  const behind = wall(), behindText = clocks();
  await p.press("a", "pause");
  expect(pausedBoth && pausedText === "paused, wall −5 s" && Math.abs(behind + 10000) < 50 && behindText === "paused, wall −10 s"
    && bothRun() && clocks() === "wall −10 s" && logged("You pause the clocks of a.") && logged("You start the clocks of a again."),
    `Pause after Wall −5 s stops both clocks of a (${pausedText}, then ${behind.toFixed(0)} ms behind after 5 s, ${behindText}), and Pause again starts both (${clocks()})`);

  // Reset clocks, after a jump and a pause: the clocks of a run again, the wall clock at true time,
  // and the clocks read as clocks that nobody touched. The log has one line for it.
  await p.press("a", "forward");
  await p.press("a", "pause");
  await p.skip(2000);
  const clocksBefore = clocks();
  const touched = !p.button("a", "reset").disabled && bothPaused() && clocksBefore === "paused, wall −7 s";
  const linesBefore = p.lines;
  await p.press("a", "reset");
  const added = [...p.$("#log").children].slice(0, p.lines - linesBefore).filter((li) => li.classList.contains("you")).map((li) => li.querySelector(".text").textContent);
  expect(touched && bothRun() && Math.abs(wall()) < 1e-3 && clocks() === "normal",
    `Reset clocks runs the clocks of a again (${clocksBefore} before), with the wall clock at true time (off by ${wall()} ms), and the clocks say ${clocks()}`);
  expect(!pressed("pause") && p.button("a", "reset").disabled && !p.button("a", "pause").disabled, "after Reset clocks, Pause is not pressed and is on, and Reset clocks is off");
  expect(JSON.stringify(added) === JSON.stringify(["You reset the clocks of a."]), `the log has one line for Reset clocks (${added.join(" | ")})`);
  // A reset whose shift has nothing to do, after a pause alone in which no fake time passed, leaves
  // the controls on.
  await p.press("a", "pause");
  await p.press("a", "reset");
  expect(bothRun() && clocks() === "normal" && !p.button("a", "pause").disabled && !p.button("a", "crash").disabled && p.button("a", "reset").disabled,
    `Reset clocks after a pause alone runs the clocks again (${clocks()}), and leaves the controls on`);

  const beforeCrash = p.requests();
  await p.press("a", "crash");
  await p.skipUntil(() => p.requests().failed > beforeCrash.failed + 2);
  const down = p.requests();
  expect(down.target === "a" && /^no answer from a(, write outcome unknown)?$/.test(down.status) && down.failing,
    `the requests keep going to a while a is crashed (${down.failed - beforeCrash.failed} failed), and their status says that no answer came, failing (${down.status})`);
  expect([...p.$("#log").children].filter((li) => li.textContent.includes("A request gets no answer from a")).length === 1, "the log says once that a request gets no answer from a");
  noClient("while a is crashed");
  const crashed = a().state === "crashed" && p.button("a", "crash").textContent === "Restart" && p.button("a", "crash").getAttribute("aria-label") === "Restart a" && p.button("a", "forward").disabled && p.button("a", "back").disabled && p.button("a", "pause").disabled && p.button("a", "reset").disabled && p.button("a", "stop").disabled && !p.button("a", "hang").disabled;
  expect(crashed, "Crash crashes a: Crash becomes Restart (named Restart a), the clocks and Stop are off, Hang, Disconnect, and Error stay on");
  await p.press("a", "crash");
  expect(a().state !== "crashed" && a().process === "a2" && p.button("a", "crash").textContent === "Crash", `Restart starts process ${a().process} of a, in the state ${a().state}`);

  await p.skipUntil(() => a().state === "running");
  const restarted = p.requests().calls;
  await p.skipUntil(() => p.requests().calls > restarted + 2);
  expect(p.requests().target === "a", `the requests keep going to a after the restart (${p.requests().calls - restarted} requests)`);

  // Once an instance serves again, the next request that it serves makes the status ok, and not
  // failing. a2 and b both wait for the lease of a1 to run out, and either can take it: if b does, the
  // requests go to b for this, and back to a after.
  await p.skipUntil(() => p.$('[data-role="serves"]'));
  const serving = p.$('[data-role="serves"]').dataset.instance;
  if (serving !== "a") await p.send(serving);
  const servedBefore = p.requests().writes + p.requests().reads;
  await p.skipUntil(() => p.requests().writes + p.requests().reads > servedBefore && p.requests().status === `ok from ${serving}`);
  expect(!p.requests().failing, `after the restart, ${serving} serves the requests, and their status is ${p.requests().status} again, not failing`);
  if (serving !== "a") await p.send("a");
  noProcess("after a crash and a restart of a");
  expect(logTexts.has("a starts again, on the cache that it left when it crashed."), "the log says that a starts again after its restart");

  // The switch sends the requests to b, and a gets none of them.
  const aBefore = p.served("a"), bBefore = p.served("b"), switched = p.requests().calls;
  await p.send("b");
  const switchB = p.$('#requests [data-target="b"]');
  expect(p.requests().target === "b" && switchB.getAttribute("aria-pressed") === "true" && switchA.getAttribute("aria-pressed") === "false" && requestsEdge() === "b",
    `the switch sends the requests to b, shows b on, and moves their edge into b (${requestsEdge() || "none"})`);
  await p.skipUntil(() => p.requests().calls > switched + 3);
  // A call that was on a at the switch can still end there; the ones after it go to b.
  const aMid = p.served("a");
  await p.skipUntil(() => p.served("b") !== bBefore && p.requests().calls > switched + 6);
  expect(p.served("a") === aMid && p.served("b") !== bBefore, `after the switch, b gets the calls (${bBefore} to ${p.served("b")}), and a none (${aBefore}, ${p.served("a")})`);
  // The requests come one at a time, so once b has answered one, the status is of a request on b.
  const onB = p.requests();
  expect(/ from b\b/.test(onB.status) && onB.failing === !onB.status.startsWith("ok "), `the status of the requests is of those on b, and failing only for a failure (${onB.status})`);
  // If b refused a request, the log said so in the words of the requests.
  const refusedB = (s) => s.split("; refused ")[1].split(",")[0];
  if (refusedB(p.served("b")) !== refusedB(bBefore)) {
    expect([...requestTexts].some((s) => s.startsWith("A request gets an error from b: ")), `b refuses calls (${refusedB(bBefore)} to ${refusedB(p.served("b"))}), and the log says that a request gets an error from b`);
  }
  noClient("with the requests sent to b");
  await p.send("a");
  expect(p.requests().target === "a" && requestsEdge() === "a", `the switch sends the requests back to a, and their edge with them (${requestsEdge() || "none"})`);

  // At phone width the diagram stacks: nothing scrolls sideways, the edge of the requests comes into
  // the instance that they go to from above, and the edge to S3 turns along the bottom of its disk and
  // clocks, dashed while it hangs.
  p.win.frameElement.style.width = "390px";
  await p.frames(2);
  const doc = p.win.document.documentElement;
  const arrow = (name) => p.win.getComputedStyle(p.inst(name).querySelector(".in"), "::after").content !== "none";
  const stacked = requestsEdge() === "" && doc.scrollWidth <= doc.clientWidth && arrow("a") && !arrow("b");
  const along = () => p.win.getComputedStyle(p.inst("a").querySelector('[data-edge="s3"]'), "::after").backgroundImage;
  const solid = along();
  await p.press("a", "hang");
  const dashed = along();
  await p.press("a", "hang");
  expect(stacked && dashed !== solid && along() === solid,
    `at 390 px the diagram stacks without scrolling sideways (${doc.scrollWidth} px wide), the requests come into a from above, and the edge of a to S3 along the bottom is dashed while it hangs (${solid} / ${dashed})`);
  p.win.frameElement.style.width = "1280px";
  await p.frames(2);

  await p.press("a", "stop");
  const stopping = ["closing", "closed"].includes(a().state);
  await p.skipUntil(() => a().state === "closed");
  const start = p.button("a", "stop").textContent === "Start" && !p.button("a", "stop").disabled;
  await p.press("a", "stop");
  await p.skipUntil(() => a().state === "running");
  expect(stopping && start && p.button("a", "stop").textContent === "Stop", "Stop closes the database of a, Stop becomes Start, and Start opens it again");

  // A crash of the instance that serves: the other takes the lease over.
  await p.skipUntil(() => p.$('[data-role="serves"]'));
  const holder = p.$('[data-role="serves"]').dataset.instance, other = holder === "a" ? "b" : "a";
  await p.press(holder, "crash");
  const took = await p.skipUntil(() => p.inst(other).dataset.role === "serves");
  expect(p.inst(holder).dataset.state === "crashed", `after a crash of ${holder}, ${other} serves, ${took / 1000} s of fake time later`);
  await p.press(holder, "crash");

  await p.skipUntil(() => p.instance(holder).state === "running");
  noProcess(`after a crash and a restart of ${holder}, which served`);

  // No limit: fake time goes past 10 minutes, and the log and the commits grow. The commits grow
  // only while the requests go to the instance that serves, and the restarted one stands by.
  if (p.requests().target !== other) await p.send(other);
  const before = { lines: p.lines, commits: p.commits };
  await p.skip(Math.max(0, 660000 - p.t));
  const s = p.win.s4qlPage.state;
  expect(p.t >= 659999 && p.lines > before.lines && p.commits > before.commits, `fake time goes on to ${p.$("#clock").textContent}, with ${p.lines} lines and ${p.commits} commit objects`);
  expect(s.violations === s.excused, `the checker finds no violation that is not excused (${s.violations} found, ${s.excused} excused)`);
  expect(p.$("#log").children.length <= 100, `the page keeps at most 100 lines of the log (${p.$("#log").children.length})`);
  const late = p.t;
  play.click();
  await until(() => p.t > late);
  expect(p.win.s4qlPage.playing, "Play goes on after 10 min");

  noProcess("after 11 min");
  noClient("after 11 min");
  // On this page a request is one that reaches the app, never one of an instance to S3: every line
  // of the log that says request is a line of the requests to the app.
  const otherRequests = [...logTexts].filter((s) => /request/i.test(s) && !/^(A request gets |You send the requests to [ab]\.$)/.test(s));
  expect(otherRequests.length === 0, `every line of the log that says request is about the requests to the app (${otherRequests.join(" | ") || logTexts.size + " lines of the log"})`);
  expect(cleanRequests(requestTexts), `the page's texts about the requests hold only what can be known from outside the app (${[...requestTexts].join(" | ")})`);

  expect(new URL(p.win.location.href).pathname === address && p.win.location.search === "" && p.win.location.hash === "", "the page writes nothing into its address");

  p.win.frameElement.remove();
  forget();
  await persistence(address);
  await kept();
  await broken();
}

// TOGGLES are the items of localStorage in which the page remembers its toggles Turbo and Sound.
const TOGGLES = ["s4ql:turbo", "s4ql:sound"];

// forget the toggles, so that the next page that loads has those of a first visit, and no step of
// the check gets the toggles that a step before it left.
function forget() {
  for (const k of TOGGLES) localStorage.removeItem(k);
}

// kept checks that the page remembers Turbo and Sound in localStorage across reloads, and that
// Reset keeps them. Sound remembered on waits, without an audio context, until the first click or key
// on the page, which makes the context in that gesture; a click on Sound itself turns it on, as from
// off. A value that the page did not write, and storage that throws, give the toggles of a first
// visit. The page at /__check/broken/audio/ counts its audio contexts from before its scripts run, in
// s4qlContexts. sitecheck's Chromium does not refuse a context outside a gesture, so the check counts
// them where a browser would refuse.
async function kept() {
  const address = "/__check/broken/audio/simulator/";
  const stored = () => TOGGLES.map((k) => String(localStorage.getItem(k))).join(", ");
  const reload = async (p) => {
    if (p) p.win.frameElement.remove();
    return open(address);
  };
  // led is how the button Sound looks: its background, and the frame of its square. Its transition is
  // off while it is read, so that it gives the look of the state and not a moment of the change.
  const led = (p) => {
    const b = p.$("#sound");
    b.style.transition = "none";
    const look = [p.win.getComputedStyle(b).backgroundColor, p.win.getComputedStyle(b.querySelector(".led")).boxShadow].join(" | ");
    b.style.transition = "";
    return look;
  };
  const sound = (p) => `${p.$("#sound").getAttribute("aria-pressed")} ${p.$("#sound").dataset.audio}`;
  const state = (p) => `turbo ${p.$("#turbo").getAttribute("aria-pressed")} at ${p.win.s4qlPage.turbo ? 5 : 1}×, sound ${sound(p)}, ${p.win.s4qlContexts} contexts, stored ${stored()}`;
  const turboOn = (p, on) => p.$("#turbo").getAttribute("aria-pressed") === String(on) && p.win.s4qlPage.turbo === on;
  const off = (p) => sound(p) === "false none" && p.win.s4qlContexts === 0 && !p.$("#sound").title;
  const waits = (p) => sound(p) === "mixed waiting" && p.win.s4qlContexts === 0 && p.$("#sound").title !== "";
  const runs = (p) => sound(p) === "true running" && !p.$("#sound").title;

  forget();
  let p = await reload(null);
  const looks = { off: led(p) };
  expect(turboOn(p, true) && off(p) && stored() === "null, null", `a first visit has Turbo on and Sound off, and stores nothing (${state(p)})`);

  // Turbo left off is off after a reload, in the button and in the speed of the first step.
  p.$("#turbo").click();
  const turboStored = stored();
  p = await reload(p);
  const before = turboOn(p, false);
  p.$("#play").click();
  await until(() => p.win.s4qlPage.lastStep);
  const step = p.win.s4qlPage.lastStep;
  p.$("#play").click();
  await until(() => p.idle() && !p.win.s4qlPage.playing);
  expect(turboStored === "off, null" && before && step.fake === step.real && off(p),
    `Turbo left off is off after a reload, in the button and in the speed (${step.fake.toFixed(1)} ms for ${step.real.toFixed(1)} ms; ${state(p)})`);

  // Sound left on waits after a reload: no context, and a button that does not say on, until the
  // first click on the page, here on Play, which makes the context in the click.
  p.$("#sound").click();
  await until(() => runs(p));
  looks.on = led(p);
  const soundStored = stored();
  p = await reload(p);
  looks.waiting = led(p);
  const waited = waits(p);
  await p.frames(30);
  expect(soundStored === "off, on" && waited && waits(p) && p.$("#dancer").dataset.moves === "0",
    `Sound left on waits after a reload, for 30 frames without an audio context, and the button says that it waits (${state(p)}, ${p.$("#sound").title})`);
  expect(new Set(Object.values(looks)).size === 3, `the button Sound looks different off, waiting, and on (${Object.entries(looks).map(([k, v]) => `${k}: ${v}`).join(" / ")})`);
  const S = await new p.win.Function("u", "return import(u)")(new URL("sound.js" + query, p.win.location.href).href);
  p.$("#play").click();
  const made = p.win.s4qlContexts, blips = S.stats.played.blip || 0;
  await until(() => runs(p));
  await until(() => Number(p.$("#dancer").dataset.moves) >= 2);
  expect(made === 1 && blips === 1 && stored() === "off, on",
    `the first click, on Play, makes the audio context in the click and sounds the blip of sound on, and sound is on once it runs, with the figure dancing (${state(p)}, ${p.$("#dancer").dataset.moves} changes of pose)`);

  // Reset keeps both toggles, in the page and in storage.
  p.$("#play").click();
  await until(() => p.idle() && !p.win.s4qlPage.playing);
  p.$("#reset").click();
  await until(() => p.html.dataset.engine === "ready" && !p.$("#reset").disabled && p.win.s4qlPage.state);
  expect(turboOn(p, false) && runs(p) && stored() === "off, on" && p.win.s4qlContexts === 1, `Reset keeps Turbo off and Sound on, in the page and in storage (${state(p)})`);

  // A key on the Sound button is the button's, and its click turns sound on from waiting, at once.
  p = await reload(p);
  const sb = p.$("#sound");
  sb.dispatchEvent(new p.win.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
  const keyed = waits(p);
  sb.click();
  const pressed = sound(p).startsWith("true ") && p.win.s4qlContexts === 1;
  await until(() => runs(p));
  sb.click();
  const soundOff = stored();
  p = await reload(p);
  expect(keyed && pressed && soundOff === "off, off" && off(p),
    `while Sound waits, a key on it leaves it waiting, a click on it turns it on at once, the next click turns it off, and it is off after a reload (${state(p)})`);

  // A key anywhere on the page starts sound that waits, but a modifier alone, Escape, or Tab, which
  // are no gesture for a browser.
  p.$("#sound").click();
  await until(() => runs(p));
  p = await reload(p);
  const key = (k) => p.win.document.body.dispatchEvent(new p.win.KeyboardEvent("keydown", { key: k, bubbles: true }));
  for (const k of ["Meta", "Shift", "Escape", "Tab"]) key(k);
  const unmoved = waits(p);
  key("k");
  const keyMade = p.win.s4qlContexts;
  await until(() => runs(p));
  expect(unmoved && keyMade === 1, `a key on the page starts Sound that waits, and Meta, Shift, Escape, and Tab before it do not (${state(p)})`);

  // Turbo turned on again is on after a reload.
  p.$("#turbo").click();
  const onAgain = stored();
  p = await reload(p);
  expect(onAgain === "on, on" && turboOn(p, true), `Turbo turned on again is on after a reload (${state(p)})`);

  // Values that the page did not write give the toggles of a first visit, and a click starts nothing.
  localStorage.setItem("s4ql:turbo", "fast");
  localStorage.setItem("s4ql:sound", "true");
  p = await reload(p);
  p.$("#play").click();
  p.$("#play").click();
  expect(turboOn(p, true) && off(p), `stored values that the page did not write give Turbo on and Sound off (${state(p)})`);
  p.win.frameElement.remove();

  // Storage that throws gives the toggles of a first visit, toggles that work, and no line about it.
  localStorage.setItem("s4ql:turbo", "off");
  localStorage.setItem("s4ql:sound", "on");
  p = await open("/__check/broken/no-storage/simulator/");
  const blocked = turboOn(p, true) && sound(p) === "false none";
  p.$("#turbo").click();
  p.$("#sound").click();
  await until(() => runs(p));
  const lines = [...p.$("#log").children].map((li) => li.textContent).filter((s) => /turbo|sound|local|remember/i.test(s));
  expect(blocked && turboOn(p, false) && lines.length === 0,
    `with storage that throws, Turbo is on and Sound off at first, both toggle, and the log says nothing of them (${p.$("#turbo").getAttribute("aria-pressed")}, ${sound(p)}${lines.length ? "; " + lines.join(" | ") : ""})`);
  p.win.frameElement.remove();
  forget();
}

// dancer checks the stick figure on the top line of the frame of the log and the commit objects, on
// the paused page after it played with sound off: it is decoration, standing with its feet on the
// line, and it has stood still so far. With sound on it stays still while paused, changes pose while
// the page plays, and stands still again after Pause. It turns sound off again at the end. sitecheck
// starts Chromium without the need of a gesture for audio, so the check does not see whether a
// visitor's click starts the audio context, only that the page's context runs.
async function dancer(p) {
  const fig = p.$("#dancer"), sound = p.$("#sound"), play = p.$("#play");
  const pose = () => `${fig.dataset.pose}, ${fig.dataset.moves} changes of pose`;
  const box = fig.getBoundingClientRect(), frame = p.$(".logs").getBoundingClientRect();
  const cs = p.win.getComputedStyle(fig);
  expect(fig.getAttribute("aria-hidden") === "true" && !fig.hasAttribute("tabindex") && cs.pointerEvents === "none" && cs.position === "absolute",
    `the figure is decoration: hidden from assistive technology, not focusable, without pointer events, and out of the flow (${cs.pointerEvents}, ${cs.position})`);
  expect(box.height >= 24 && box.height <= 48 && Math.abs(box.bottom - frame.top) < 0.5 && box.left >= frame.left && box.right <= frame.right,
    `the figure stands on the top line of the frame of the log, ${box.width} by ${box.height} px, with its feet at ${box.bottom - frame.top} px from the line`);
  expect(fig.dataset.pose === "stand" && fig.dataset.moves === "0", `while the page played with sound off, the figure stood still (${pose()})`);

  sound.click();
  await until(() => sound.dataset.audio !== "none" && sound.dataset.audio !== "suspended");
  expect(sound.getAttribute("aria-pressed") === "true" && sound.dataset.audio === "running", `sound is on, and its audio context runs (${sound.dataset.audio})`);
  await p.frames(30);
  expect(fig.dataset.pose === "stand" && fig.dataset.moves === "0", `with sound on, the paused page's figure stands still for 30 frames (${pose()})`);

  play.click();
  await until(() => Number(fig.dataset.moves) >= 2);
  expect(true, `with sound on, the playing page's figure dances (${pose()})`);

  play.click();
  await until(() => p.idle() && fig.dataset.pose === "stand");
  const moves = fig.dataset.moves;
  await p.frames(30);
  expect(fig.dataset.pose === "stand" && fig.dataset.moves === moves, `after Pause, the figure stands still for 30 frames (${pose()})`);

  sound.click();
  expect(sound.getAttribute("aria-pressed") === "false" && fig.dataset.pose === "stand", `sound is off again, and the figure stands (${pose()})`);
}

// soundWakes checks that sound which is on comes back when the browser suspends the audio context
// by itself, as Safari can: the figure stands at once, and the page resumes the context when its state
// changes, at the next sound, and at the next key or click. The check holds the browser's resume
// itself, since sitecheck's Chromium never refuses one, and lets it go for the click. It starts and
// ends paused with sound off.
async function soundWakes(p) {
  const sound = p.$("#sound"), play = p.$("#play"), fig = p.$("#dancer");
  const proto = p.win.AudioContext.prototype, resume = proto.resume;
  let ctx = null, resumes = 0, hold = false;
  proto.resume = function () {
    ctx = this;
    resumes++;
    return hold ? Promise.resolve() : resume.call(this);
  };
  try {
    sound.click();
    await until(() => ctx && sound.dataset.audio === "running");
    play.click();
    await until(() => fig.dataset.pose !== "stand");

    hold = true;
    let n = resumes;
    await ctx.suspend();
    await until(() => sound.dataset.audio === "suspended");
    expect(sound.getAttribute("aria-pressed") === "true" && fig.dataset.pose === "stand" && resumes > n,
      `when the browser suspends the context while sound is on and the page plays, the figure stands at once, and the page asks to resume (${resumes - n} times; ${fig.dataset.pose})`);
    const moves = fig.dataset.moves;
    await p.frames(30);
    expect(fig.dataset.pose === "stand" && fig.dataset.moves === moves, `while the context is suspended, the figure stands still for 30 frames (${fig.dataset.moves} changes of pose)`);
    // A request that ends while the page plays is a sound, and no click.
    n = resumes;
    const calls = p.requests().calls;
    await until(() => p.requests().calls > calls);
    expect(resumes > n, `the next sound asks to resume the context (${resumes - n} times)`);

    play.click();
    await until(() => p.idle());
    n = resumes;
    p.win.document.body.dispatchEvent(new p.win.KeyboardEvent("keydown", { key: "Shift", bubbles: true }));
    expect(resumes > n, `a key anywhere on the page asks to resume the context (${resumes - n} times)`);

    hold = false;
    n = resumes;
    p.win.document.body.click();
    const asked = expect(resumes > n, `a click anywhere on the page asks to resume the context (${resumes - n} times)`);
    if (asked) await until(() => sound.dataset.audio === "running");
    expect(sound.getAttribute("aria-pressed") === "true" && sound.dataset.audio === "running", `after the click, sound is on and its context runs again (${sound.dataset.audio})`);
  } finally {
    proto.resume = resume;
  }
  sound.click();
  expect(sound.getAttribute("aria-pressed") === "false" && !p.win.s4qlPage.playing, "sound is off again, and the page is paused");
}

// sqlBox checks the box for SQL on the paused page: its line, its example, a select on barcodes, a
// table of the visitor's own with inserts and a select with order by and limit, an error of the
// engine, the refusal of a write to barcodes, the limit of its length, and a statement that waits
// while the connection to S3 hangs. While paused, Run moves fake time only until the answer.
async function sqlBox(p) {
  const note = p.$("#sql-note"), link = note.querySelector("a");
  expect(link && new URL(link.href).pathname === "/" && new URL(link.href).hash === "#roadmap" && /barcodes/.test(note.textContent) && p.$('label[for="sql-text"]') && p.$("#sql-run").getAttribute("aria-keyshortcuts"),
    `the box says what SQL works, links to the roadmap, names barcodes, and has a label and keys (${note.textContent})`);
  const example = p.$("#sql-text").value;
  expect(/^select code from barcodes/.test(example), `the box holds a working example at first (${example})`);
  const rows = () => [...p.$("#sql-rows").querySelectorAll("tbody tr")].map((tr) => [...tr.children].map((td) => td.textContent).join(" "));
  const failing = () => p.$("#sql-status").dataset.failing === "true";

  let t0 = p.t;
  let line = await p.sql(example);
  const ended = p.win.s4qlPage.box.result;
  expect(/^a serves \d+ rows?\.$/.test(line) && rows().length > 0 && rows().length <= 5 && rows().every((r) => /^57\d{11}$/.test(r)),
    `Run selects from barcodes: ${line} (${rows().join(", ")})`);
  expect(!p.win.s4qlPage.playing && p.t > t0 && ended.t <= p.win.s4qlPage.t && p.win.s4qlPage.t - ended.t < 1000,
    `while paused, Run moves fake time from ${t0} to ${p.win.s4qlPage.t} ms, just past the answer at ${ended.t} ms, and the page stays paused`);

  line = await p.sql("create table mine (k integer primary key, v text, r real, b blob) strict, without rowid");
  expect(/^a commits [0-9a-f]{8}\.$/.test(line), `the box creates a table of its own: ${line}`);
  for (const values of ["1, 'one', 1.5, x'00ff'", "2, null, 2.0, null", "3, 'it''s', null, x''"]) {
    line = await p.sql(`insert into mine values (${values})`, true);
    expect(/^a commits [0-9a-f]{8}: 1 row changed\.$/.test(line), `Ctrl+Enter inserts (${values}): ${line}`);
  }
  line = await p.sql("select k, v, r, b from mine order by k desc limit 2");
  const got = rows().join(" | ");
  expect(line === "a serves 2 rows." && got === "3 'it''s' null x'' | 2 null 2.0 null" && p.$("#sql-rows th").textContent === "k",
    `a select with order by and limit shows its rows, each value as SQL writes it: ${line} (${got})`);
  line = await p.sql("select * from mine where k > 9");
  expect(line === "a serves 0 rows." && rows().length === 0 && !p.$("#sql-rows").hidden, `an empty result: ${line}`);

  line = await p.sql("select missing from mine");
  expect(line === "Error from a: no such column: missing" && failing() && p.$("#sql-rows").hidden, `an error of the engine, in its own words: ${line}`);
  line = await p.sql("delete from barcodes");
  expect(line === "Refused by the simulator: barcodes is the app's table, so the box can only select from it." && failing(), `a write to barcodes is refused before it reaches the engine: ${line}`);

  const area = p.$("#sql-text");
  area.value = "select '" + "x".repeat(1000) + "'";
  area.dispatchEvent(new p.win.Event("input", { bubbles: true }));
  expect(p.$("#sql-run").disabled && /at most 1,000 characters, and this has 1,009/.test(p.$("#sql-status").textContent),
    `a statement over the limit is not sent, and the box says so (${p.$("#sql-status").textContent})`);

  // While the connection of a to S3 hangs, a write waits on the paused page, visibly, and fake time
  // stands still until Play.
  await p.press("a", "hang");
  t0 = p.t;
  line = await p.sql("insert into mine values (4, 'late', null, null)");
  const box = p.$("#sql");
  await p.frames(10);
  expect(box.dataset.pending === "true" && box.dataset.waiting === "true" && p.t === t0 && p.$("#sql-run").disabled && /Play to let time move/.test(line),
    `a write waits while the connection to S3 hangs, and fake time stands still at ${p.t} ms: ${line}`);
  await p.press("a", "hang");
  p.$("#play").click();
  await until(() => box.dataset.pending === "false");
  p.$("#play").click();
  await until(() => p.idle());
  line = p.$("#sql-status").textContent;
  expect(/^(a commits [0-9a-f]{8}: 1 row changed\.|Not committed on a: .+|Outcome unknown on a: .+)$/.test(line), `with time moving, the write ends: ${line}`);
  line = await p.sql("select k from mine order by k desc limit 1");
  expect(line === "a serves 1 row.", `the box goes on after the wait: ${line}`);

  // A statement sent while the page plays goes in, and one that is still on its way when the page
  // pauses is answered as on a paused page.
  p.$("#play").click();
  await until(() => p.win.s4qlPage.playing);
  area.value = "select v from mine where k = 1";
  area.dispatchEvent(new p.win.Event("input", { bubbles: true }));
  p.$("#sql-run").click();
  p.$("#play").click();
  await until(() => box.dataset.pending === "false" && p.idle());
  line = p.$("#sql-status").textContent;
  expect(!p.win.s4qlPage.playing && line === "a serves 1 row.", `a statement sent while playing and paused at once is answered: ${line}`);
}

// persistence checks that S3 outlives a reload of the tab and that Reset empties it: the tab's
// database in sessionStorage, which the frames of this page share with it, as the frames of one tab
// do. A reload keeps the database, its name, and the time of the history, and the instance a gets its
// data from S3 before it serves. Reset empties it and keeps the name. The page stops cleanly at the
// cap, and Reset starts over from there. A write that fails leaves nothing half-written, and a stored
// database that is damaged or of another version is dropped, with a line in the log.
async function persistence(address) {
  const stored = () => Object.keys(sessionStorage).filter((k) => k.startsWith("s4ql:") && k !== "s4ql:box").sort();
  const objects = () => stored().filter((k) => k === "s4ql:m" || k.startsWith("s4ql:c:")).length;
  const logHas = (p, re) => [...p.$("#log").children].some((li) => re.test(li.textContent));
  // reload the page in a new frame.
  const reload = async (p) => {
    if (p) p.win.frameElement.remove();
    return open(address);
  };

  let p = await reload(null);
  const name = p.$("#s3-path").textContent;
  const before = { commits: p.commits, history: p.win.s4qlPage.history, objects: objects() };
  expect(/^s4ql-sim\/db-[a-z0-9]{6}\/$/.test(name) && before.commits > 0 && before.objects === before.commits + 1,
    `S3 holds the database ${name} of the tab after a reload, with ${before.commits} commit objects, ${before.objects} objects in sessionStorage`);
  p = await reload(p);
  // The time of the history after the reload is the offset of the seed plus the time of the session,
  // a sum of floats that can come out a rounding below the sum that was stored, as 660017.381003
  // against 660017.3810030001.
  expect(p.$("#s3-path").textContent === name && p.commits === before.commits && p.win.s4qlPage.history >= before.history - 1e-6 && logHas(p, /S3 still holds db-/),
    `a reload keeps the database, its name, and its ${p.commits} commit objects, and the time goes on from ${p.$("#clock").textContent}` +
    ` (${p.$("#s3-path").textContent}, ${before.commits} commit objects, ${before.history} to ${p.win.s4qlPage.history} ms of history, the log: ${[...p.$("#log").children].slice(-3).map((li) => li.textContent).join(" | ")})`);
  const took = await p.skipUntil(() => logHas(p, /^\S+a catches up: \d+ commit objects? from S3\.$/) && p.inst("a").dataset.role === "serves");
  const s = p.win.s4qlPage.state;
  expect(s.violations === s.excused,
    `a catches up from S3 and serves ${took / 1000} s of fake time after the reload, and the checker finds no violation that is not excused (${s.violations})`);
  // The visitor's table is in S3 after the reload, and the box has the text that it had.
  const text = p.$("#sql-text").value;
  const line = await p.sql("select v from mine where k = 1");
  expect(text === "select v from mine where k = 1" && line === "a serves 1 row." && p.$("#sql-rows tbody td").textContent === "'one'",
    `after the reload, the box has its text again (${text}), and the visitor's table is there: ${line}`);

  // A stored object that is missing, and a stored version of other formats: the page starts empty.
  sessionStorage.removeItem(stored().find((k) => k.startsWith("s4ql:c:")));
  p = await reload(p);
  expect(p.commits === 0 && logHas(p, /could not be read/) && p.$("#s3-path").textContent === name, `a stored database without one of its objects is dropped, and S3 starts empty`);
  await p.skipUntil(() => p.commits > 2);
  const meta = JSON.parse(sessionStorage.getItem("s4ql:meta"));
  sessionStorage.setItem("s4ql:meta", JSON.stringify({ ...meta, version: "0-0" }));
  p = await reload(p);
  expect(p.commits === 0 && logHas(p, /could not be read/), `a stored database of another version is dropped, and S3 starts empty`);

  // A write that the browser's storage refuses, as when large values of the box fill it: nothing
  // half-written stays, and the page stops, as S3 is full, until Reset.
  await p.skipUntil(() => p.commits > 2);
  const proto = p.win.Storage.prototype, setItem = proto.setItem;
  proto.setItem = function (k, v) {
    if (k.startsWith("s4ql:c:")) throw new p.win.DOMException("The quota has been exceeded.", "QuotaExceededError");
    return setItem.call(this, k, v);
  };
  const failure = p.$("#failure");
  while (failure.hidden) {
    const to = Math.floor(p.win.s4qlPage.t) + 1000 - 1;
    p.win.s4qlPage.skip(1000);
    await until(() => !failure.hidden || (p.t >= to && p.idle()));
  }
  proto.setItem = setItem;
  expect(/^S3 is full\..*Reset to start over\.$/.test(failure.textContent) && stored().join() === "s4ql:name" && p.$("#sql-run").disabled && !p.$("#reset").disabled,
    `a write that the storage refuses drops the stored database, and the page stops (${failure.textContent}; ${stored().join(", ")})`);

  // Reset empties the database, keeps its name, and stores again.
  p.$("#reset").click();
  await until(() => p.html.dataset.engine === "ready" && !p.$("#reset").disabled && p.win.s4qlPage.state);
  expect(p.commits === 0 && p.t < 1000 && !p.win.s4qlPage.playing && p.$("#s3-path").textContent === name && p.$("#log").textContent === "Nothing yet.",
    `Reset empties the database ${name}, and the page waits at ${p.$("#clock").textContent}`);
  // The cap: the page stops cleanly, and Reset starts over from there.
  const box = p.$("#failure");
  while (box.hidden) {
    const to = Math.floor(p.win.s4qlPage.t) + 600000 - 1;
    p.win.s4qlPage.skip(600000);
    await until(() => !box.hidden || (p.t >= to && p.idle()));
  }
  const full = p.commits;
  expect(/S3 is full/.test(box.textContent) && full >= 2000 && objects() === full + 1 && !p.$("#reset").disabled,
    `at ${full} commit objects the page stops, says that S3 is full, keeps them in sessionStorage, and offers Reset (${box.textContent})`);
  p.$("#reset").click();
  await until(() => p.html.dataset.engine === "ready" && !p.$("#reset").disabled && p.win.s4qlPage.state && box.hidden);
  expect(p.commits === 0 && objects() === 0, "Reset after the stop starts over");
  p.win.frameElement.remove();

  // A tab that the browser gives no storage, and a new tab, whose sessionStorage is empty.
  const blocked = await load("/__check/broken/no-storage/simulator/");
  expect(blocked.html.dataset.engine === "ready" && /^s4ql-sim\/db-[a-z0-9]{6}\/$/.test(blocked.win.document.getElementById("s3-path").textContent) &&
    blocked.win.document.getElementById("log").textContent.includes("does not store S3"), "a tab without storage runs in memory, with a database of its own name");
  blocked.frame.remove();
  sessionStorage.clear();
  p = await reload(null);
  expect(p.$("#s3-path").textContent !== name && p.commits === 0, `a new tab, with an empty sessionStorage, gets a database of its own (${p.$("#s3-path").textContent})`);
  p.win.frameElement.remove();
}

// broken checks that a fault at start-up ends in the page's failure box, which asks for a reload:
// the page without run.js, and the page without its Play button, as a page.js of one deploy would
// find the HTML of another. sitecheck serves the site with each fault under /__check/broken/.
async function broken() {
  for (const [how, what] of [["no-run", "run.js is not found"], ["no-play", "the page has no Play button"]]) {
    const { frame, win, html } = await load(`/__check/broken/${how}/simulator/`);
    const box = win.document.getElementById("failure");
    expect(html.dataset.engine === "failed" && !box.hidden && box.textContent.includes("Reload to try again"), `when ${what}, the page shows its failure box (${box.textContent})`);
    frame.remove();
  }
}

try {
  await check();
} catch (e) {
  expect(false, "the check could not go on: " + (e && e.stack || e));
}
await fetch("/__check/result", { method: "POST", body: JSON.stringify({ ok, lines }) });
</script>
